<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8"/>
<meta name="viewport" content="width=device-width, initial-scale=1.0"/>
<title>Lead Finder - Sessions</title>
<link rel="icon" type="image/svg+xml" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 64 64'%3E%3Crect width='64' height='64' rx='12' fill='%230f172a'/%3E%3Ctext x='32' y='44' text-anchor='middle' font-family='-apple-system,BlinkMacSystemFont,sans-serif' font-weight='800' font-size='32' fill='%2338bdf8'%3ELS%3C/text%3E%3C/svg%3E"/>
<style>
*{box-sizing:border-box;margin:0;padding:0}
body{font-family:-apple-system,BlinkMacSystemFont,'Segoe UI',Roboto,sans-serif;background:#0f172a;color:#f1f5f9;min-height:100vh}
.app{max-width:1400px;margin:0 auto;padding:2rem}
.nav{display:flex;gap:0.5rem;margin-bottom:2rem;flex-wrap:wrap}
.nav a{padding:0.6rem 1.2rem;background:#1e293b;color:#94a3b8;text-decoration:none;border-radius:6px;font-size:0.9rem;transition:all 0.2s}
.nav a:hover,.nav a.active{background:#38bdf8;color:#0f172a;font-weight:600}
.card{background:#1e293b;border-radius:10px;padding:1.5rem;margin-bottom:1.5rem}
.card h2{font-size:1rem;color:#94a3b8;margin-bottom:1rem;text-transform:uppercase;letter-spacing:0.05em}
.stats-grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(150px,1fr));gap:1rem;margin-bottom:1.5rem}
.stat-card{background:#1e293b;border-radius:10px;padding:1.2rem;text-align:center}
.stat-value{font-size:2rem;font-weight:700;color:#38bdf8}
.stat-label{font-size:0.8rem;color:#64748b;text-transform:uppercase;margin-top:0.3rem}
.table-wrap{overflow-x:auto}
table{width:100%;border-collapse:collapse;font-size:0.9rem}
th{text-align:left;padding:0.75rem 1rem;background:#0f172a;color:#64748b;font-weight:600;font-size:0.75rem;text-transform:uppercase}
td{padding:0.75rem 1rem;border-bottom:1px solid #1e293b}
tr:hover td{background:#1e293b}
.btn{padding:0.6rem 1.4rem;background:#38bdf8;color:#0f172a;border:none;border-radius:6px;font-size:0.9rem;font-weight:600;cursor:pointer}
.btn-sm{padding:0.4rem 0.8rem;font-size:0.8rem}
.hidden{display:none}
.badge{display:inline-block;padding:0.2rem 0.5rem;border-radius:4px;font-size:0.75rem;font-weight:600}
.badge-local{background:#22c55e33;color:#22c55e}
.badge-hq{background:#f59e0b33;color:#f59e0b}
.badge-blue{background:#38bdf833;color:#38bdf8}
/* Sortable column headers (added 2026-06-16) */
th.sortable{cursor:pointer;user-select:none;position:relative;padding-right:1.1rem;transition:background 0.15s}
th.sortable:hover{background:rgba(56,189,248,0.15);color:#38bdf8}
th.sortable::after{content:'⇅';position:absolute;right:0.4rem;top:50%;transform:translateY(-50%);color:#475569;font-size:0.75rem;opacity:0.5}
th.sortable.sort-asc::after{content:'▲';color:#38bdf8;opacity:1}
th.sortable.sort-desc::after{content:'▼';color:#38bdf8;opacity:1}
</style>
</head>
<body>
<div class="app">
<div class="nav">
<a href="/finder/">Search</a>
<a href="/finder/sessions" class="active">Sessions</a>
<a href="/finder/companies">Companies</a>
<a href="/finder/contacts">Contacts</a>
<a href="/finder/emails">&#9993; Email Validation</a>
  <a href="/finder/audit">Audit</a>
<span style="margin-left:auto;display:flex;gap:0.5rem;align-items:center;font-size:0.8rem;">
  <span style="color:#22c55e;">P1-P5 ✓</span>
  <span style="background:#22c55e33;color:#22c55e;padding:0.3rem 0.6rem;border-radius:4px;font-weight:600;" title="AI Enrichment enabled (added 2026-06-06)">QC-10 AI ✓</span>
</span>
</div>

<div class="stats-grid">
<div class="stat-card"><div class="stat-value" id="statCompanies">-</div><div class="stat-label">Companies</div></div>
<div class="stat-card"><div class="stat-value" id="statContacts">-</div><div class="stat-label">Contacts</div></div>
<div class="stat-card"><div class="stat-value" id="statSessions">-</div><div class="stat-label">Sessions</div></div>
</div>

<div class="card">
<h2>Search Sessions</h2>
<div style="display:flex;align-items:center;gap:0.5rem;margin-bottom:0.5rem;">
<label style="font-size:0.8rem;color:#94a3b8;">Per page: <select id="perPage" onchange="loadSessions()">
<option value="20">20</option><option value="50">50</option><option value="100">100</option><option value="200">200</option>
</select></label>
<span style="color:#94a3b8;font-size:0.8rem;" id="pageInfo"></span>
</div>
<div class="table-wrap">
<table>
<thead><tr><th class="sortable" data-sort-key="session_key">Session Key</th><th class="sortable" data-sort-key="industry">Industry</th><th class="sortable" data-sort-key="city">City</th><th class="sortable" data-sort-key="state">State</th><th class="sortable" data-sort-key="created_at">Created</th><th>Actions</th></tr></thead>
<tbody id="sessionsTable"></tbody>
</table>
</div>
</div>

<div id="sessionDetail" class="card hidden">
<h2 id="detailTitle" style="font-size:1.1rem;color:#38bdf8;margin-bottom:1rem;"></h2>
<div id="detailContent"></div>
</div>

</div>

<script>
const API_BASE = '/api';
const API_KEY = 'lf_key_P9xZq3RvLm7YwT2hJm8FvNu4BcDEs6';

// Sortable column handler (added 2026-06-16) — for all 3 tables on this page
function _compareValues(a, b, dir) {
  const aNull = a === null || a === undefined || a === '';
  const bNull = b === null || b === undefined || b === '';
  if (aNull && bNull) return 0;
  if (aNull) return 1;
  if (bNull) return -1;
  if (typeof a === 'number' && typeof b === 'number') {
    return dir === 'asc' ? a - b : b - a;
  }
  const sa = String(a).toLowerCase();
  const sb = String(b).toLowerCase();
  if (sa < sb) return dir === 'asc' ? -1 : 1;
  if (sa > sb) return dir === 'asc' ? 1 : -1;
  return 0;
}

function sortByKey(arr, key, dir) {
  return arr.slice().sort((a, b) => _compareValues(a ? a[key] : null, b ? b[key] : null, dir));
}

function wireSortableHeaders(table, sortState) {
  // For a given table element, wire up click handlers on all th.sortable.
  // sortState: { key, dir } shared across the page so all tables
  // sorted by the same column stay consistent.
  const ths = table.querySelectorAll('th.sortable');
  ths.forEach(th => {
    if (th.__wired) return;  // avoid double-binding
    th.__wired = true;
    th.addEventListener('click', () => {
      const key = th.getAttribute('data-sort-key');
      if (sortState.key === key) {
        sortState.dir = sortState.dir === 'asc' ? 'desc' : 'asc';
      } else {
        sortState.key = key;
        const numericKeys = ['contact_count', 'confidence_score', 'rating', 'user_rating_count', 'quality_score'];
        sortState.dir = numericKeys.includes(key) ? 'desc' : 'asc';
      }
      ths.forEach(t => {
        t.classList.remove('sort-asc', 'sort-desc');
        if (t.getAttribute('data-sort-key') === sortState.key) {
          t.classList.add(sortState.dir === 'asc' ? 'sort-asc' : 'sort-desc');
        }
      });
      // Re-render: caller must re-fetch the rows and re-apply
      table.dispatchEvent(new CustomEvent('sortchange', { detail: { key, dir: sortState.dir } }));
    });
  });
}

async function loadStats() {
  try {
    const r = await fetch(API_BASE+'/stats', {headers: {'X-LF-Key': API_KEY}});
    if (!r.ok) return;
    const d = await r.json();
    document.getElementById('statCompanies').textContent = d.companies || 0;
    document.getElementById('statContacts').textContent = d.contacts || 0;
    document.getElementById('statSessions').textContent = d.sessions || 0;
  } catch(e) { console.error('stats error:', e); }
}

// Sessions table sort state (added 2026-06-16)
let sessionsSort = { key: 'created_at', dir: 'desc' };

async function loadSessions() {
  const r = await fetch(API_BASE+'/sessions', {headers: {'X-LF-Key': API_KEY}});
  let sessions = await r.json();
  sessions = sortByKey(sessions, sessionsSort.key, sessionsSort.dir);
  const perPage = parseInt(document.getElementById('perPage').value) || 20;
  const tbody = document.getElementById('sessionsTable');
  tbody.innerHTML = '';
  document.getElementById('pageInfo').textContent = sessions.length + ' sessions' + (sessions.length > perPage ? ' (showing ' + perPage + ')' : '');
  const maxShow = Math.min(perPage, sessions.length);
  for (let i = 0; i < maxShow; i++) {
    const s = sessions[i];
    const created = s.created_at ? s.created_at.substring(0,16).replace('T',' ') : '';
     tbody.innerHTML += '<tr><td style="font-family:monospace;color:#38bdf8;">'+s.session_key+'</td><td>'+s.industry+'</td><td>'+s.city+'</td><td>'+s.state+'</td><td>'+created+'</td><td><button class="btn btn-sm" onclick="loadSession(\''+s.session_key+'\')">View</button> <button class="btn btn-sm btn-orange" onclick="resumeSession(\''+s.session_key+'\')">Resume</button> <button class="btn btn-sm btn-green" onclick="exportSession(\''+s.session_key+'\')">Export</button></td></tr>';
  }
  // Wire up sortable headers on the main sessions table
  const table = tbody.closest('table');
  if (table) {
    wireSortableHeaders(table, sessionsSort);
    // Mark the current sort
    table.querySelectorAll('th.sortable').forEach(t => {
      t.classList.remove('sort-asc', 'sort-desc');
      if (t.getAttribute('data-sort-key') === sessionsSort.key) {
        t.classList.add(sessionsSort.dir === 'asc' ? 'sort-asc' : 'sort-desc');
      }
    });
    table.addEventListener('sortchange', () => loadSessions());
  }
}

// Session-detail sub-table sort state (added 2026-06-16)
let companiesSubSort = { key: 'name', dir: 'asc' };
let contactsSubSort = { key: 'full_name', dir: 'asc' };
let sessionDetailData = null;  // stored so sort can re-render

function escapeAttr(s) { return String(s == null ? '' : s).replace(/'/g, "\\'"); }

function renderCompaniesSubTable(companies, contacts) {
  if (!companies || companies.length === 0) return '';
  const ctMap = {};
  for (const ct of (contacts || [])) { const cid = ct.company_id || 0; ctMap[cid] = (ctMap[cid]||0)+1; }
  const rows = companies.map(c => {
    const ctCount = (c.contact_count !== undefined) ? c.contact_count : (ctMap[c.id]||0);
    const reBtn = '<button class="btn btn-sm btn-orange" onclick="reEnrichCompany(\''+escapeAttr(c.place_id)+'\', \''+escapeAttr(c.name)+'\', '+ctCount+')" title="Re-discover executives">Refresh</button>';
    const fcBtn = (ctCount > 0)
      ? '<button class="btn btn-sm btn-amber" onclick="findContacts(\''+escapeAttr(c.place_id)+'\', \''+escapeAttr(c.name)+'\', '+ctCount+')" title="'+ctCount+' contacts already found — click to re-discover">Find Contacts ('+ctCount+')</button>'
      : '<button class="btn btn-sm btn-green" onclick="findContacts(\''+escapeAttr(c.place_id)+'\', \''+escapeAttr(c.name)+'\', 0)" title="Find contacts (initial discovery)">Find Contacts</button>';
    return '<tr data-name="'+escapeAttr(c.name||'')+'" data-city="'+escapeAttr(c.city||'')+'" data-state="'+escapeAttr(c.state||'')+'" data-business_type="'+escapeAttr(c.business_type||'')+'" data-contact_count="'+ctCount+'">'
      + '<td style="font-weight:600;">'+(c.name||'')+'</td>'
      + '<td>'+(c.city||'')+'</td>'
      + '<td>'+(c.state||'')+'</td>'
      + '<td>'+(c.business_type||'')+'</td>'
      + '<td>'+ctCount+'</td>'
      + '<td>'+reBtn+' '+fcBtn+'</td></tr>';
  }).join('');
  return '<h3 style="margin-top:1rem;font-size:0.9rem;color:#94a3b8;margin-bottom:0.75rem;">Companies</h3>'
    + '<div class="table-wrap"><table id="subCompaniesTable"><thead><tr>'
    + '<th class="sortable" data-sort-key="name">Name</th>'
    + '<th class="sortable" data-sort-key="city">City</th>'
    + '<th class="sortable" data-sort-key="state">State</th>'
    + '<th class="sortable" data-sort-key="business_type">Type</th>'
    + '<th class="sortable" data-sort-key="contact_count">Contacts</th>'
    + '<th>Actions</th>'
    + '</tr></thead><tbody>' + rows + '</tbody></table></div>';
}

function renderContactsSubTable(contacts) {
  if (!contacts || contacts.length === 0) return '';
  const rows = contacts.map(ct => {
    const badge = ct.is_local ? '<span class="badge badge-local">LOCAL</span>' : '<span class="badge badge-hq">HQ</span>';
    return '<tr data-full_name="'+escapeAttr(ct.full_name||'')+'" data-title="'+escapeAttr(ct.title||'')+'" data-company_name="'+escapeAttr(ct.company_name||'')+'" data-confidence_score="'+(ct.confidence_score||0)+'">'
      + '<td>'+(ct.full_name||'')+'</td>'
      + '<td>'+(ct.title||'-')+'</td>'
      + '<td>'+(ct.company_name||'')+'</td>'
      + '<td>'+badge+'</td>'
      + '<td>'+((ct.confidence_score||0)*100).toFixed(0)+'%</td></tr>';
  }).join('');
  return '<h3 style="margin-top:1.5rem;font-size:0.9rem;color:#94a3b8;margin-bottom:0.75rem;">Contacts</h3>'
    + '<div class="table-wrap"><table id="subContactsTable"><thead><tr>'
    + '<th class="sortable" data-sort-key="full_name">Name</th>'
    + '<th class="sortable" data-sort-key="title">Title</th>'
    + '<th class="sortable" data-sort-key="company_name">Company</th>'
    + '<th>Local</th>'
    + '<th class="sortable" data-sort-key="confidence_score">Confidence</th>'
    + '</tr></thead><tbody>' + rows + '</tbody></table></div>';
}

function reSortSubTables() {
  // Re-order rows in the embedded sub-tables based on the current sort.
  for (const cfg of [{ sel: '#subCompaniesTable', state: companiesSubSort, map: c => ({
      name: c.name, city: c.city, state: c.state,
      business_type: c.business_type, contact_count: c.contact_count || 0,
    }) }, { sel: '#subContactsTable', state: contactsSubSort, map: ct => ({
      full_name: ct.full_name, title: ct.title, company_name: ct.company_name,
      confidence_score: ct.confidence_score || 0,
    }) }]) {
    const tbl = document.querySelector(cfg.sel);
    if (!tbl) continue;
    const tbody = tbl.querySelector('tbody');
    const rows = Array.from(tbody.querySelectorAll('tr'));
    rows.sort((a, b) => {
      const av = a.getAttribute('data-' + cfg.state.key);
      const bv = b.getAttribute('data-' + cfg.state.key);
      // numeric coercion
      const an = parseFloat(av), bn = parseFloat(bv);
      if (!isNaN(an) && !isNaN(bn) && /^-?[\d.]+$/.test(av) && /^-?[\d.]+$/.test(bv)) {
        return cfg.state.dir === 'asc' ? an - bn : bn - an;
      }
      const sa = (av || '').toLowerCase();
      const sb = (bv || '').toLowerCase();
      if (sa < sb) return cfg.state.dir === 'asc' ? -1 : 1;
      if (sa > sb) return cfg.state.dir === 'asc' ? 1 : -1;
      return 0;
    });
    rows.forEach(r => tbody.appendChild(r));
    // Update header indicators
    tbl.querySelectorAll('th.sortable').forEach(t => {
      t.classList.remove('sort-asc', 'sort-desc');
      if (t.getAttribute('data-sort-key') === cfg.state.key) {
        t.classList.add(cfg.state.dir === 'asc' ? 'sort-asc' : 'sort-desc');
      }
    });
  }
}

function wireSubTableSort() {
  // Wire up sort for both embedded tables; the sort change triggers
  // reSortSubTables() to re-order rows in place.
  for (const cfg of [{ sel: '#subCompaniesTable', state: companiesSubSort }, { sel: '#subContactsTable', state: contactsSubSort }]) {
    const tbl = document.querySelector(cfg.sel);
    if (!tbl) continue;
    wireSortableHeaders(tbl, cfg.state);
    // Mark default sort
    tbl.querySelectorAll('th.sortable').forEach(t => {
      t.classList.remove('sort-asc', 'sort-desc');
      if (t.getAttribute('data-sort-key') === cfg.state.key) {
        t.classList.add(cfg.state.dir === 'asc' ? 'sort-asc' : 'sort-desc');
      }
    });
    tbl.addEventListener('sortchange', reSortSubTables);
  }
}

async function loadSession(sk) {
  try {
    const r = await fetch(API_BASE+'/session/'+sk+'/results', {headers: {'X-LF-Key': API_KEY}});
    const data = await r.json();
    window.currentSessionKey = sk;  // Store for re-enrich
    const detail = document.getElementById('sessionDetail');
    detail.classList.remove('hidden');
    document.getElementById('detailTitle').textContent = 'Session: '+data.session.industry+' in '+data.session.city+', '+data.session.state;
    // Store data for sort re-renders
    sessionDetailData = data;
    let html = '<div style="display:grid;grid-template-columns:repeat(3,1fr);gap:1rem;margin-bottom:1rem;"><div class="stat-card"><div class="stat-value">'+(data.companies.length||0)+'</div><div class="stat-label">Companies</div></div><div class="stat-card"><div class="stat-value">'+(data.contacts.length||0)+'</div><div class="stat-label">Contacts</div></div></div>';
    // Add Re-Enrich All button
    html += '<div style="margin-bottom:1rem;"><button class="btn btn-orange" onclick="reEnrichAll()">Refresh Contacts</button> <span style="color:#64748b;font-size:0.8rem;">Re-runs executive discovery for all companies</span></div>';
    html += renderCompaniesSubTable(data.companies, data.contacts);
    html += renderContactsSubTable(data.contacts);
    document.getElementById('detailContent').innerHTML = html;
    // Wire up sorting for the newly-rendered sub-tables
    wireSubTableSort();
  } catch(e) { console.error(e); }
}

function exportSession(sk) {
  window.open(API_BASE+'/export/contacts/'+sk, '_blank');
}

async function resumeSession(sk) {
  const r = await fetch(API_BASE+'/session/'+sk+'/resume', {
    method: 'POST',
    headers: {'Content-Type':'application/json','X-LF-Key':API_KEY}
  });
  if (r.ok) {
    const d = await r.json();
    // Navigate to the search page with the session loaded (fixes Issue #4)
    // The search page reads ?session=KEY and auto-loads the results.
    const target = d.redirect_url || ('/?session='+sk);
    window.location.href = target;
  } else {
    alert('Failed to resume session');
  }
}

async function reEnrichCompany(placeId, companyName, existingCount) {
  // Issue #1: confirm before re-running if contacts already exist
  let prompt = 'Re-discover executives for '+companyName+'?\n\nThis will re-run the enrichment pipeline.';
  if (existingCount && existingCount > 0) {
    prompt = companyName + ' already has ' + existingCount + ' contacts.\n\nRe-discover executives? Existing contacts are kept.';
  }
  if (!confirm(prompt)) return;
  try {
    const r = await fetch(API_BASE+'/discover/'+placeId+'/executives', {
      method: 'POST',
      headers: {'Content-Type':'application/json','X-LF-Key':API_KEY},
      body: JSON.stringify({})
    });
    const d = await r.json();
    if (r.ok) {
      alert('Found '+d.count+' contacts for '+companyName);
      if (window.currentSessionKey) loadSession(window.currentSessionKey);
    } else {
      alert('Re-enrichment for "'+companyName+'" failed:\n'+(d.detail||JSON.stringify(d)||'unknown error'));
    }
  } catch(e) {
    alert('Network error re-enriching "'+companyName+'":\n'+e.message);
  }
}

async function findContacts(placeId, companyName, existingCount) {
  // Issue #1: confirm before re-running if contacts already exist
  if (existingCount && existingCount > 0) {
    const ok = confirm(companyName + ' already has ' + existingCount + ' contacts.\n\nRun the discovery pipeline again? Existing contacts are kept; new ones may be added.');
    if (!ok) return;
  } else {
    if (!confirm('Find contacts for '+companyName+'?\n\nThis runs the full discovery pipeline.')) return;
  }
  const r = await fetch(API_BASE+'/discover/'+placeId+'/executives', {
    method: 'POST',
    headers: {'Content-Type':'application/json','X-LF-Key':API_KEY},
    body: JSON.stringify({})
  });
  const d = await r.json();
  if (r.ok) {
    alert('Found '+(d.count||0)+' contacts for '+companyName);
    if (window.currentSessionKey) loadSession(window.currentSessionKey);
  } else {
    alert('Discovery failed: '+(d.detail||'unknown error'));
  }
}

async function reEnrichAll() {
  if (!window.currentSessionKey) { alert('No session loaded'); return; }
  if (!confirm('Re-discover executives for ALL companies in this session?')) return;
  // Fetch session companies
  const r = await fetch(API_BASE+'/session/'+window.currentSessionKey+'/results', {headers: {'X-LF-Key': API_KEY}});
  const d = await r.json();
  let enriched = 0;
  for (const c of (d.companies||[])) {
    try {
      const rr = await fetch(API_BASE+'/discover/'+c.place_id+'/executives', {
        method: 'POST',
        headers: {'Content-Type':'application/json','X-LF-Key':API_KEY},
        body: JSON.stringify({})
      });
      if (rr.ok) enriched++;
    } catch(e) {}
  }
  alert('Re-enriched '+enriched+'/'+d.companies.length+' companies');
  loadSession(window.currentSessionKey);
}

loadStats();
loadSessions();
</script>
</body>
</html>
