<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8"/>
<meta name="viewport" content="width=device-width, initial-scale=1.0"/>
<title>Lead Finder - Send Queue</title>
<link rel="icon" type="image/svg+xml" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 64 64'%3E%3Crect width='64' height='64' rx='12' fill='%230f172a'/%3E%3Ctext x='32' y='44' text-anchor='middle' font-family='-apple-system,BlinkMacSystemFont,sans-serif' font-weight='800' font-size='32' fill='%2338bdf8'%3ELS%3C/text%3E%3C/svg%3E"/>
<style>
*{box-sizing:border-box;margin:0;padding:0}
body{font-family:-apple-system,BlinkMacSystemFont,'Segoe UI',Roboto,sans-serif;background:#0f172a;color:#f1f5f9;min-height:100vh}
.app{max-width:1600px;margin:0 auto;padding:2rem}
.nav{display:flex;gap:0.5rem;margin-bottom:2rem;flex-wrap:wrap}
.nav a{padding:0.6rem 1.2rem;background:#1e293b;color:#94a3b8;text-decoration:none;border-radius:6px;font-size:0.9rem;transition:all 0.2s}
.nav a:hover,.nav a.active{background:#38bdf8;color:#0f172a;font-weight:600}
.card{background:#1e293b;border-radius:10px;padding:1.5rem;margin-bottom:1.5rem}
.card h2{font-size:1rem;color:#94a3b8;margin-bottom:1rem;text-transform:uppercase;letter-spacing:0.05em}
.stats-grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(140px,1fr));gap:1rem;margin-bottom:1.5rem}
.stat-card{background:#1e293b;border-radius:10px;padding:1.2rem;text-align:center}
.stat-value{font-size:2rem;font-weight:700;color:#38bdf8}
.stat-label{font-size:0.8rem;color:#64748b;text-transform:uppercase;margin-top:0.3rem}
.btn{padding:0.5rem 1.2rem;background:#38bdf8;color:#0f172a;border:none;border-radius:6px;font-size:0.85rem;font-weight:600;cursor:pointer;transition:opacity 0.2s}
.btn:hover{opacity:0.85}
.btn-sm{padding:0.3rem 0.6rem;font-size:0.75rem;border-radius:4px;cursor:pointer;border:none;font-weight:600}
.btn-green{background:#22c55e;color:#0f172a}
.btn-red{background:#ef4444;color:#fff}
.btn-orange{background:#f59e0b;color:#0f172a}
.btn-purple{background:#8b5cf6;color:#fff}
.btn-slate{background:#334155;color:#94a3b8}
input,select,textarea{padding:0.5rem 0.8rem;background:#0f172a;border:1px solid #334155;color:#f1f5f9;border-radius:6px;font-size:0.85rem;min-width:140px;font-family:inherit}
input:focus,select:focus,textarea:focus{outline:none;border-color:#38bdf8}
.table-wrap{overflow-x:auto}
table{width:100%;border-collapse:collapse;font-size:0.8rem;table-layout:fixed}
th{text-align:left;padding:0.5rem 0.6rem;background:#0f172a;color:#64748b;font-weight:600;font-size:0.7rem;text-transform:uppercase;white-space:nowrap;overflow:hidden}
td{padding:0.5rem 0.6rem;border-bottom:1px solid #1e293b;overflow:hidden;text-overflow:ellipsis}
tr:hover td{background:#1e293b}
th:nth-child(1),td:nth-child(1){width:30px;text-align:center;overflow:visible}
th:nth-child(2),td:nth-child(2){width:14%} /* Name */
th:nth-child(3),td:nth-child(3){width:10%} /* Title */
th:nth-child(4),td:nth-child(4){width:12%} /* Company */
th:nth-child(5),td:nth-child(5){width:22%;overflow:visible;word-break:break-all} /* Email */
th:nth-child(6),td:nth-child(6){width:12%} /* Pattern */
th:nth-child(7),td:nth-child(7){width:9%} /* Status */
th:nth-child(8),td:nth-child(8){width:10%} /* Staged */
th:nth-child(9),td:nth-child(9){width:14%;overflow:visible} /* Actions */
.badge{display:inline-block;padding:0.15rem 0.4rem;border-radius:4px;font-size:0.7rem;font-weight:600}
.badge-green{background:#22c55e33;color:#22c55e}
.badge-red{background:#ef444433;color:#ef4444}
.badge-orange{background:#f59e0b33;color:#f59e0b}
.badge-gray{background:#64748b33;color:#94a3b8}
.badge-blue{background:#38bdf833;color:#38bdf8}
.filter-row{display:flex;gap:0.75rem;flex-wrap:wrap;margin-bottom:1rem;align-items:center}
.bulk-bar{display:none;align-items:center;gap:0.5rem;margin-bottom:0.5rem;padding:0.6rem 1rem;background:#1e293b;border-radius:6px;border:1px solid #334155}
.bulk-bar.active{display:flex}
.bulk-count{color:#38bdf8;font-size:0.85rem;font-weight:600}
.page-controls{display:flex;align-items:center;gap:0.5rem;margin-bottom:0.5rem;flex-wrap:wrap}
.page-info{color:#94a3b8;font-size:0.8rem}
.action-group{display:inline-flex;gap:2px;flex-wrap:nowrap;align-items:center}
input[type="checkbox"]{accent-color:#38bdf8;width:16px;height:16px;cursor:pointer;padding:0;background:transparent;border:none;min-width:0}
.msg{padding:0.75rem 1rem;border-radius:6px;margin-bottom:1rem;font-size:0.9rem}
.msg-info{background:#38bdf833;color:#38bdf8}
.msg-error{background:#ef444433;color:#ef4444}
.msg-success{background:#22c55e33;color:#22c55e}
.msg-warning{background:#f59e0b33;color:#f59e0b}
.hidden{display:none}
/* Toast */
.toast{position:fixed;bottom:2rem;right:2rem;padding:1rem 1.5rem;border-radius:8px;font-size:0.9rem;font-weight:600;z-index:2000;transform:translateY(150%);transition:transform 0.3s}
.toast.show{transform:translateY(0)}
.toast-success{background:#22c55e;color:#fff}
.toast-error{background:#ef4444;color:#fff}
.toast-info{background:#38bdf8;color:#0f172a}
</style>
</head>
<body>
<div class="app">
<div class="nav">
<a href="/finder/">Search</a>
<a href="/finder/sessions">Sessions</a>
<a href="/finder/companies">Companies</a>
<a href="/finder/contacts">Contacts</a>
<a href="/finder/emails" class="active">&#9993; Send Queue</a>
<a href="/finder/audit">Audit</a>
<span style="margin-left:auto;display:flex;gap:0.5rem;align-items:center;font-size:0.8rem;">
  <span style="color:#22c55e;">P1-P5 &#10003;</span>
  <span style="background:#22c55e33;color:#22c55e;padding:0.3rem 0.6rem;border-radius:4px;font-weight:600;">QC-10 AI &#10003;</span>
</span>
</div>

<div class="stats-grid">
<div class="stat-card"><div class="stat-value" id="statQueued">-</div><div class="stat-label">Queued</div></div>
<div class="stat-card"><div class="stat-value" id="statApproved">-</div><div class="stat-label">Approved</div></div>
<div class="stat-card"><div class="stat-value" id="statSent">-</div><div class="stat-label">Sent</div></div>
<div class="stat-card"><div class="stat-value" id="statFailed">-</div><div class="stat-label">Failed</div></div>
<div class="stat-card"><div class="stat-value" id="statSkipped">-</div><div class="stat-label">Skipped</div></div>
</div>

<div class="card">
<div style="display:flex;justify-content:space-between;align-items:center;margin-bottom:1rem;">
  <h2 style="margin:0;">Send Queue</h2>
  <div style="display:flex;gap:0.5rem;align-items:center;">
    <span style="font-size:0.8rem;color:#94a3b8;">Template:</span>
    <select id="templateSelect" style="min-width:180px;"><option value="">Loading templates...</option></select>
  </div>
</div>

<div class="filter-row">
<label style="font-size:0.8rem;color:#94a3b8;">Status: <select id="filterStatus" onchange="loadSendReady()"><option value="">All Active</option><option value="queued">Queued</option><option value="approved">Approved</option><option value="sent">Sent</option><option value="failed">Failed</option><option value="skipped">Skipped</option></select></label>
<label style="font-size:0.8rem;color:#94a3b8;">Company: <select id="filterCompany" onchange="loadSendReady()"><option value="">All</option></select></label>
<label style="font-size:0.8rem;color:#94a3b8;">Session: <select id="filterSession" onchange="loadSendReady()"><option value="">All</option></select></label>
<button class="btn" onclick="loadSendReady()">Refresh</button>
<button class="btn btn-green" onclick="exportQueueCSV()">&#8681; Export CSV</button>
</div>

<div class="page-controls">
<label style="font-size:0.8rem;color:#94a3b8;">Per page: <select id="perPage" onchange="renderQueue()">
<option value="20">20</option><option value="50">50</option><option value="100">100</option><option value="200">200</option>
</select></label>
<span class="page-info" id="pageInfo"></span>
</div>

<div class="bulk-bar" id="bulkBar">
<span class="bulk-count" id="bulkCount">0 selected</span>
<button class="btn btn-sm btn-green" onclick="sendSelected(true)" title="Dry-run render only; no email leaves the system">&#128270; Preview</button>
<button class="btn btn-sm btn-purple" onclick="sendSelected(false)" title="Send selected emails now, 15s apart">&#9993; Send Selected</button>
<button class="btn btn-sm btn-slate" onclick="skipSelected()" title="Remove selected from queue (mark skipped)">Skip</button>
<button class="btn btn-sm btn-red" onclick="removeSelected()" title="Hard-delete selected rows from the queue">Delete</button>
<button class="btn btn-sm btn-slate" onclick="clearSelection()">Clear</button>
</div>

<div id="queueMsg"></div>
<div class="table-wrap">
<table>
<thead><tr>
<th><input type="checkbox" id="selectAll" onchange="toggleSelectAll()" title="Select all visible rows" /></th>
<th>Name</th>
<th>Title</th>
<th>Company</th>
<th>Email</th>
<th>Pattern</th>
<th>Status</th>
<th>Staged</th>
<th>Actions</th>
</tr></thead>
<tbody id="queueTable"></tbody>
</table>
</div>
</div>
</div>

<div class="toast" id="toast"></div>

<script src="/api-key-loader.js"></script>
<script>
let allRows = [];
let filteredRows = [];
let selectedIds = new Set();
let companyOptions = [];
let sessionOptions = [];
let templates = [];
let currentPage = 1;

function esc(s) { const d = document.createElement('div'); d.textContent = s || ''; return d.innerHTML; }
function escAttr(s) { return String(s == null ? '' : s).replace(/&/g, '&amp;').replace(/"/g, '&quot;').replace(/'/g, '&#39;'); }
function showToast(msg, type) { const t = document.getElementById('toast'); t.textContent = msg; t.className = 'toast toast-'+type+' show'; setTimeout(()=>t.classList.remove('show'), 3500); }

function getHeaders() {
  const h = new Headers({'Content-Type': 'application/json', 'X-LF-Key': requireApiKey()});
  return h;
}

async function api(method, path, body) {
  const opts = {method, headers: getHeaders()};
  if (body) opts.body = JSON.stringify(body);
  const r = await fetch(path, opts);
  if (!r.ok) {
    const err = await r.text().catch(() => r.statusText);
    throw new Error(`${r.status}: ${err}`);
  }
  return r.json();
}

function statusBadge(status) {
  let cls = 'badge-gray', label = status || 'unknown';
  if (status === 'queued') { cls = 'badge-blue'; }
  else if (status === 'approved') { cls = 'badge-orange'; }
  else if (status === 'sent') { cls = 'badge-green'; }
  else if (status === 'failed') { cls = 'badge-red'; }
  else if (status === 'skipped') { cls = 'badge-gray'; }
  return `<span class="badge ${cls}">${esc(label)}</span>`;
}

// ---- Selection ----
function updateBulkUI() {
  const n = selectedIds.size;
  document.getElementById('bulkCount').textContent = n + ' selected';
  document.getElementById('bulkBar').classList.toggle('active', n > 0);
}

function toggleQueueSelection(id, checked) {
  checked ? selectedIds.add(id) : selectedIds.delete(id);
  updateBulkUI();
}

function toggleSelectAll() {
  const c = document.getElementById('selectAll').checked;
  selectedIds.clear();
  if (c) {
    // Only select visible page rows so the user sees what's selected.
    const perPage = parseInt(document.getElementById('perPage').value) || 20;
    const pageRows = filteredRows.slice((currentPage - 1) * perPage, currentPage * perPage);
    pageRows.forEach(r => selectedIds.add(r.id));
  }
  document.querySelectorAll('.sq-cb').forEach(cb => cb.checked = c);
  updateBulkUI();
}

function clearSelection() {
  selectedIds.clear();
  document.getElementById('selectAll').checked = false;
  document.querySelectorAll('.sq-cb').forEach(cb => cb.checked = false);
  updateBulkUI();
}

// ---- Load data ----
async function loadTemplates() {
  try {
    const data = await api('GET', '/api/email/templates');
    templates = data.templates || [];
    const sel = document.getElementById('templateSelect');
    if (!templates.length) {
      sel.innerHTML = '<option value="">No templates found</option>';
      return;
    }
    sel.innerHTML = templates.map((t, i) => `<option value="${escAttr(t.path)}" ${i===0?'selected':''}>${esc(t.name)}</option>`).join('');
  } catch (e) { console.error('templates', e); }
}

async function loadDropdowns() {
  try {
    const companies = await api('GET', '/api/companies?limit=500');
    companyOptions = companies.companies || [];
    document.getElementById('filterCompany').innerHTML = '<option value="">All</option>' + companyOptions.map(c => `<option value="${c.id}">${esc(c.name)}</option>`).join('');

    const sessions = await api('GET', '/api/sessions');
    sessionOptions = sessions || [];
    document.getElementById('filterSession').innerHTML = '<option value="">All</option>' + sessionOptions.map(s => `<option value="${escAttr(s.session_key)}">${esc(s.session_key)}</option>`).join('');
  } catch (e) { console.error('dropdowns', e); }
}

async function loadStats() {
  try {
    const data = await api('GET', '/api/email/send-ready?limit=10000');
    const rows = data.contacts || [];
    const counts = {queued:0, approved:0, sent:0, failed:0, skipped:0};
    for (const r of rows) {
      const s = r.status || 'queued';
      if (counts[s] !== undefined) counts[s]++;
    }
    document.getElementById('statQueued').textContent = counts.queued;
    document.getElementById('statApproved').textContent = counts.approved;
    document.getElementById('statSent').textContent = counts.sent;
    document.getElementById('statFailed').textContent = counts.failed;
    document.getElementById('statSkipped').textContent = counts.skipped;
  } catch (e) { console.error('stats', e); }
}

async function loadSendReady() {
  const status = document.getElementById('filterStatus').value;
  const companyId = document.getElementById('filterCompany').value;
  const sessionKey = document.getElementById('filterSession').value;
  const msg = document.getElementById('queueMsg');
  try {
    let url = '/api/email/send-ready?limit=5000';
    if (status) url += '&status=' + encodeURIComponent(status);
    if (companyId) url += '&company_id=' + encodeURIComponent(companyId);
    if (sessionKey) url += '&session_key=' + encodeURIComponent(sessionKey);
    const data = await api('GET', url);
    allRows = data.contacts || [];
    filteredRows = allRows;
    currentPage = 1;
    renderQueue();
    loadStats();
  } catch (e) {
    msg.innerHTML = `<div class="msg msg-error">Failed to load queue: ${esc(e.message)}</div>`;
  }
}

// ---- Render ----
function renderQueue() {
  const tbody = document.getElementById('queueTable');
  const pageInfo = document.getElementById('pageInfo');
  const perPage = parseInt(document.getElementById('perPage').value) || 20;
  tbody.innerHTML = '';
  if (!filteredRows.length) {
    pageInfo.textContent = 'No rows';
    tbody.innerHTML = '<tr><td colspan="9" style="text-align:center;color:#64748b;padding:1.5rem;">No contacts in the send queue yet. Use Contacts &#8594; Validate Emails to stage them.</td></tr>';
    return;
  }

  const total = filteredRows.length;
  const maxPage = Math.max(1, Math.ceil(total / perPage));
  if (currentPage > maxPage) currentPage = maxPage;
  const start = (currentPage - 1) * perPage;
  const pageRows = filteredRows.slice(start, start + perPage);

  pageInfo.innerHTML = `${total} total &middot; page ${currentPage} of ${maxPage}`;
  for (const r of pageRows) {
    const tr = document.createElement('tr');
    const checked = selectedIds.has(r.id) ? ' checked' : '';
    const cb = `<input type="checkbox" class="sq-cb" data-id="${r.id}"${checked} />`;
    const pattern = r.pattern_template || r.company_email_pattern || '-';
    const staged = r.staged_at ? r.staged_at.substring(0, 19).replace('T',' ') : '-';
    const sent = r.sent_at ? r.sent_at.substring(0, 19).replace('T',' ') : '-';
    const displayDate = (r.status === 'sent' || r.status === 'failed') ? sent : staged;
    const actions = `<div class="action-group">
      <button class="btn-sm btn-green" onclick="previewRow(${r.id})" title="Dry-run preview this email">&#128270;</button>
      <button class="btn-sm btn-purple" onclick="sendRow(${r.id})" title="Send this email now">&#9993;</button>
      <button class="btn-sm btn-slate" onclick="skipRows([${r.id}])" title="Mark skipped">Skip</button>
      <button class="btn-sm btn-red" onclick="removeRows([${r.id}])" title="Delete from queue">&#10005;</button>
    </div>`;
    tr.innerHTML = `<td>${cb}</td>
      <td title="${escAttr(r.full_name)}">${esc(r.full_name)}</td>
      <td title="${escAttr(r.title)}">${esc(r.title || '-')}</td>
      <td title="${escAttr(r.company_name)}">${esc(r.company_name || '-')}</td>
      <td style="overflow:visible;word-break:break-all;" title="${escAttr(r.queued_email)}"><span style="font-family:monospace;font-size:0.75rem;">${esc(r.queued_email)}</span></td>
      <td title="${escAttr(pattern)}">${esc(pattern)}</td>
      <td>${statusBadge(r.status)}</td>
      <td style="font-size:0.75rem;color:#94a3b8;">${esc(displayDate)}</td>
      <td style="overflow:visible;">${actions}</td>`;
    tr.querySelector('.sq-cb').addEventListener('change', function() { toggleQueueSelection(r.id, this.checked); });
    tbody.appendChild(tr);
  }

  document.getElementById('selectAll').checked = pageRows.every(r => selectedIds.has(r.id));
}

function changePage(delta) {
  const perPage = parseInt(document.getElementById('perPage').value) || 20;
  const maxPage = Math.max(1, Math.ceil(filteredRows.length / perPage));
  currentPage = Math.max(1, Math.min(maxPage, currentPage + delta));
  renderQueue();
}

// ---- Actions ----
function selectedQueueIds() {
  return Array.from(selectedIds);
}

async function sendSelected(dryRun) {
  const ids = selectedQueueIds();
  if (!ids.length) { showToast('No rows selected', 'error'); return; }
  const templatePath = document.getElementById('templateSelect').value;
  if (!templatePath) { showToast('Select a template first', 'error'); return; }
  const action = dryRun ? 'Preview' : 'Send';
  if (!confirm(`${action} ${ids.length} selected emails?\n\nTemplate: ${templates.find(t => t.path === templatePath)?.name || templatePath}\n${dryRun ? 'No real email will be sent.' : 'Real sends are spaced 15s apart.'}`)) return;
  try {
    const data = await api('POST', '/api/email/send-batch', {queue_ids: ids, body_template_path: templatePath, dry_run: dryRun});
    showToast(`${action} job started: ${data.job_id}`, 'success');
    clearSelection();
  } catch (e) { showToast(action + ' failed: ' + e.message, 'error'); }
}

async function sendRow(id) {
  const templatePath = document.getElementById('templateSelect').value;
  if (!templatePath) { showToast('Select a template first', 'error'); return; }
  try {
    const data = await api('POST', '/api/email/send-batch', {queue_ids: [id], body_template_path: templatePath, dry_run: false});
    showToast('Send job started: ' + data.job_id, 'success');
    clearSelection();
  } catch (e) { showToast('Send failed: ' + e.message, 'error'); }
}

async function previewRow(id) {
  const templatePath = document.getElementById('templateSelect').value;
  if (!templatePath) { showToast('Select a template first', 'error'); return; }
  try {
    const data = await api('POST', '/api/email/send-batch', {queue_ids: [id], body_template_path: templatePath, dry_run: true});
    showToast('Preview job started: ' + data.job_id, 'info');
  } catch (e) { showToast('Preview failed: ' + e.message, 'error'); }
}

async function skipRows(ids) {
  if (!ids.length) return;
  try {
    await api('POST', '/api/email/send-ready/remove', {queue_ids: ids});
    showToast(ids.length + ' row(s) skipped', 'info');
    selectedIds = new Set(Array.from(selectedIds).filter(id => !ids.includes(id)));
    loadSendReady();
  } catch (e) { showToast('Skip failed: ' + e.message, 'error'); }
}

async function removeRows(ids) {
  if (!ids.length) return;
  if (!confirm(`Permanently delete ${ids.length} queue row(s)?`)) return;
  try {
    await api('POST', '/api/email/send-ready/remove', {queue_ids: ids, hard_delete: true});
    showToast(ids.length + ' row(s) deleted', 'success');
    selectedIds = new Set(Array.from(selectedIds).filter(id => !ids.includes(id)));
    loadSendReady();
  } catch (e) { showToast('Delete failed: ' + e.message, 'error'); }
}

function skipSelected() { skipRows(selectedQueueIds()); clearSelection(); }
function removeSelected() { removeRows(selectedQueueIds()); clearSelection(); }

function exportQueueCSV() {
  if (!allRows.length) { showToast('Nothing to export', 'error'); return; }
  const headers = ['id','status','queued_email','full_name','title','company_name','city','state','pattern_template','staged_at','sent_at','send_error'];
  const rows = allRows.map(r => headers.map(h => `"${String(r[h] || '').replace(/"/g, '""')}"`).join(','));
  const csv = [headers.join(','), ...rows].join('\n');
  const blob = new Blob([csv], {type: 'text/csv'});
  const url = URL.createObjectURL(blob);
  const a = document.createElement('a');
  a.href = url;
  a.download = `lf_send_queue_${new Date().toISOString().slice(0,10)}.csv`;
  a.click();
  URL.revokeObjectURL(url);
  showToast('Exported ' + allRows.length + ' rows', 'success');
}

(async function bootstrap() {
  try {
    await initApiKey();
    await loadTemplates();
    await loadDropdowns();
    loadSendReady();
  } catch (e) {
    showToast('Failed to initialize page: ' + e.message, 'error');
  }
})();
</script>
</body>
</html>
