<html lang="en">
<head>
<meta charset="UTF-8"/>
<meta name="viewport" content="width=device-width, initial-scale=1.0"/>
<title>Lead Finder - Companies</title>

<style>
*{box-sizing:border-box;margin:0;padding:0}
body{font-family:-apple-system,BlinkMacSystemFont,'Segoe UI',Roboto,sans-serif;background:#0f172a;color:#f1f5f9;min-height:100vh}
.app{max-width:1400px;margin:0 auto;padding:1.5rem 2rem}
.nav{display:flex;gap:0.5rem;margin-bottom:2rem;flex-wrap:wrap}
.nav a{padding:0.6rem 1.2rem;background:#1e293b;color:#94a3b8;text-decoration:none;border-radius:6px;font-size:0.9rem;transition:all 0.2s}
.nav a:hover,.nav a.active{background:#38bdf8;color:#0f172a;font-weight:600}
.card{background:#1e293b;border-radius:10px;padding:1rem 1.2rem;margin-bottom:1rem}
.card h2{font-size:1rem;color:#94a3b8;margin-bottom:1rem;text-transform:uppercase;letter-spacing:0.05em}
.stats-grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(120px,1fr));gap:0.75rem;margin-bottom:1rem}
.stat-card{background:#1e293b;border-radius:8px;padding:0.8rem;text-align:center}
.stat-value{font-size:1.5rem;font-weight:700;color:#38bdf8}
.stat-label{font-size:0.7rem;color:#64748b;text-transform:uppercase;margin-top:0.2rem}
.filter-row{display:flex;gap:0.75rem;flex-wrap:wrap;margin-bottom:1rem}
input,select{padding:0.6rem 1rem;background:#0f172a;border:1px solid #334155;color:#f1f5f9;border-radius:6px;font-size:0.9rem;min-width:160px}
input:focus,select:focus{outline:none;border-color:#38bdf8}
.btn{padding:0.6rem 1.4rem;background:#38bdf8;color:#0f172a;border:none;border-radius:6px;font-size:0.9rem;font-weight:600;cursor:pointer}
.btn-sm{padding:0.4rem 0.8rem;font-size:0.8rem}
.btn-green{background:#22c55e;color:#0f172a}
.btn-orange{background:#f59e0b;color:#0f172a}
.btn-red{background:#ef4444;color:#fff}
.btn-amber{background:#f59e0b;color:#0f172a}
.btn-slate{background:#334155;color:#94a3b8}
.table-wrap{overflow-x:auto}
table{width:100%;border-collapse:collapse;font-size:0.8rem;table-layout:fixed}
th{text-align:left;padding:0.5rem 0.6rem;background:#0f172a;color:#64748b;font-weight:600;font-size:0.7rem;text-transform:uppercase;white-space:nowrap;overflow:hidden}
td{padding:0.5rem 0.6rem;border-bottom:1px solid #1e293b;vertical-align:middle;overflow:hidden;text-overflow:ellipsis}
tr:hover td{background:#1e293b}
th:nth-child(1),td:nth-child(1){width:30px}
th:nth-child(2),td:nth-child(2){width:18%}
th:nth-child(3),td:nth-child(3){width:10%}
th:nth-child(4),td:nth-child(4){width:5%}
th:nth-child(5),td:nth-child(5){width:12%}
th:nth-child(6),td:nth-child(6){width:12%}
th:nth-child(7),td:nth-child(7){width:15%}
th:nth-child(8),td:nth-child(8){width:5%}
th:nth-child(9),td:nth-child(9){width:15%;overflow:visible}
.pattern-badge{display:inline-block;padding:0.15rem 0.4rem;border-radius:4px;font-size:0.7rem;font-weight:600;max-width:180px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.pattern-badge-yes{background:#22c55e33;color:#22c55e}
.pattern-badge-no{background:#334155;color:#94a3b8}
.action-group{display:inline-flex;gap:2px;flex-wrap:nowrap;align-items:center}
.action-group .btn-sm{padding:2px 4px;font-size:0.7rem;min-width:20px;min-height:20px;text-align:center;line-height:1;white-space:nowrap}
.btn-blue{background:#38bdf8;color:#0f172a}
.toggle-label{display:flex;align-items:center;gap:0.4rem;font-size:0.8rem;color:#94a3b8;cursor:pointer;user-select:none}
.toggle-label input{accent-color:#38bdf8}
tr.deleted-row{opacity:0.5}
tr.deleted-row td{text-decoration:line-through;color:#64748b}
.trash-icon{cursor:pointer;font-size:0.75rem}
/* Modal */
.modal-overlay{position:fixed;inset:0;background:rgba(0,0,0,0.7);display:none;align-items:center;justify-content:center;z-index:1000}
.modal-overlay.active{display:flex}
.modal{background:#1e293b;border-radius:10px;padding:2rem;width:90%;max-width:500px;max-height:90vh;overflow-y:auto}
.modal h3{margin-bottom:1rem;color:#f1f5f9}
.modal-row{margin-bottom:1rem}
.modal-row label{display:block;font-size:0.8rem;color:#94a3b8;margin-bottom:0.3rem}
.modal-row input,.modal-row select{width:100%;padding:0.6rem 1rem;background:#0f172a;border:1px solid #334155;color:#f1f5f9;border-radius:6px;font-size:0.9rem}
.modal-row input:focus,.modal-row select:focus{outline:none;border-color:#38bdf8}
.modal-actions{display:flex;gap:0.75rem;justify-content:flex-end;margin-top:1.5rem}
.toast{position:fixed;bottom:2rem;right:2rem;padding:1rem 1.5rem;border-radius:8px;z-index:2000;color:#fff;font-weight:600;animation:slideIn 0.2s}
.toast-success{background:#22c55e}
.toast-error{background:#ef4444}
@keyframes slideIn{from{transform:translateX(100%);opacity:0}to{transform:translateX(0);opacity:1}}
/* Sortable column headers (added 2026-06-16) */
th.sortable{cursor:pointer;user-select:none;position:relative;padding-right:1.1rem;transition:background 0.15s}
th.sortable:hover{background:rgba(56,189,248,0.15);color:#38bdf8}
th.sortable::after{content:'⇅';position:absolute;right:0.4rem;top:50%;transform:translateY(-50%);color:#475569;font-size:0.75rem;opacity:0.5}
th.sortable.sort-asc::after{content:'▲';color:#38bdf8;opacity:1}
th.sortable.sort-desc::after{content:'▼';color:#38bdf8;opacity:1}
</style>
</head>
<body>

<script>
const API_BASE = '/api';
const API_KEY = 'lf_key_P9xZq3RvLm7YwT2hJm8FvNu4BcDEs6';

// State
let companiesData = [];
let currentPatternCompanyId = null;
let currentPatternCompany = null;
// Sort state (added 2026-06-16)
let currentSort = { key: 'name', dir: 'asc' };
// Bulk selection state
let selectedCompanyIds = new Set();

// Generic comparator for companies table
function _compareValues(a, b, dir) {
  const aNull = a === null || a === undefined || a === '';
  const bNull = b === null || b === undefined || b === '';
  if (aNull && bNull) return 0;
  if (aNull) return 1;
  if (bNull) return -1;
  if (typeof a === 'number' && typeof b === 'number') {
    return dir === 'asc' ? a - b : b - a;
  }
  const sa = String(a).toLowerCase();
  const sb = String(b).toLowerCase();
  if (sa < sb) return dir === 'asc' ? -1 : 1;
  if (sa > sb) return dir === 'asc' ? 1 : -1;
  return 0;
}

function sortCompanies(arr, key, dir) {
  return arr.slice().sort((a, b) => _compareValues(a ? a[key] : null, b ? b[key] : null, dir));
}

function applyCompanySort() {
  return sortCompanies(companiesData, currentSort.key, currentSort.dir);
}

function handleCompanySortClick(key) {
  if (currentSort.key === key) {
    currentSort.dir = currentSort.dir === 'asc' ? 'desc' : 'asc';
  } else {
    currentSort.key = key;
    const numericKeys = ['contact_count', 'rating', 'user_rating_count', 'quality_score'];
    currentSort.dir = numericKeys.includes(key) ? 'desc' : 'asc';
  }
  document.querySelectorAll('th.sortable').forEach(th => {
    th.classList.remove('sort-asc', 'sort-desc');
    if (th.getAttribute('data-sort-key') === key) {
      th.classList.add(currentSort.dir === 'asc' ? 'sort-asc' : 'sort-desc');
    }
  });
  renderCompanies(applyCompanySort());
}

document.addEventListener('DOMContentLoaded', () => {
  document.querySelectorAll('th.sortable').forEach(th => {
    th.addEventListener('click', () => handleCompanySortClick(th.getAttribute('data-sort-key')));
  });
  const def = document.querySelector('th.sortable[data-sort-key="' + currentSort.key + '"]');
  if (def) def.classList.add('sort-asc');
});

// Helpers
function escapeHtml(s) {
  if (s == null) return '';
  return String(s)
    .replace(/&/g, '&amp;')
    .replace(/</g, '&lt;')
    .replace(/>/g, '&gt;')
    .replace(/"/g, '&quot;')
    .replace(/'/g, '&#39;');
}

function showToast(msg, type) {
  const t = document.createElement('div');
  t.className = 'toast toast-' + (type === 'success' ? 'success' : 'error');
  t.textContent = msg;
  document.body.appendChild(t);
  setTimeout(() => t.remove(), 3000);
}

function extractDomain(url) {
  if (!url) return '';
  try {
    let u = url.trim();
    if (!/^https?:\/\//i.test(u)) u = 'http://' + u;
    const parsed = new URL(u);
    return parsed.hostname.replace(/^www\./, '');
  } catch(e) {
    const m = url.match(/(?:https?:\/\/)?(?:www\.)?([^\/\?#]+)/i);
    return m ? m[1] : url;
  }
}

// Format business_type: underscores → spaces, title-case
function formatBusinessType(c) {
  // Use canonical_business_type if available and non-empty
  if (c.canonical_business_type && c.canonical_business_type.trim()) {
    return c.canonical_business_type.trim();
  }
  const raw = (c.business_type || '').trim();
  if (!raw) return '';
  // Replace underscores with spaces, then title-case each word
  return raw.replace(/_/g, ' ').replace(/\b\w/g, ch => ch.toUpperCase());
}

async function loadStats() {
  try {
    const r = await fetch(API_BASE+'/stats', {headers: {'X-LF-Key': API_KEY}});
    if (!r.ok) return;
    const d = await r.json();
    document.getElementById('statCompanies').textContent = d.companies || 0;
    document.getElementById('statContacts').textContent = d.contacts || 0;
    document.getElementById('statSessions').textContent = d.sessions || 0;
  } catch(e) { console.error('stats error:', e); }
}

async function loadCompanyDropdowns() {
  try {
    const r = await fetch(API_BASE+'/companies/dropdowns', {headers: {'X-LF-Key': API_KEY}});
    if (!r.ok) return;
    const d = await r.json();
    const indSel = document.getElementById('filterIndustry');
    indSel.innerHTML = '<option value="">All Industries</option>' +
      (d.industries||[]).map(v => '<option value="'+escapeHtml(v)+'">'+escapeHtml(v.replace(/_/g,' '))+'</option>').join('');
    const citySel = document.getElementById('filterCity');
    citySel.innerHTML = '<option value="">All Cities</option>' +
      (d.cities||[]).map(v => '<option value="'+escapeHtml(v)+'">'+escapeHtml(v)+'</option>').join('');
    const stateSel = document.getElementById('filterState');
    stateSel.innerHTML = '<option value="">All States</option>' +
      (d.states||[]).map(v => '<option value="'+escapeHtml(v)+'">'+escapeHtml(v)+'</option>').join('');
  } catch(e) { console.error('dropdowns error:', e); }
}

function renderRow(c) {
  const tr = document.createElement('tr');
  tr.dataset.companyId = c.id;
  tr.dataset.companyJson = JSON.stringify(c);
  if (c.is_deleted) tr.classList.add('deleted-row');
  // Note: is_deleted is no longer used — all deletes are permanent now

  // Checkbox
  const cbChecked = selectedCompanyIds.has(c.id) ? ' checked' : '';

  // Pattern cell content
  let patternHtml;
  if (c.email_pattern) {
    patternHtml = '<span class="pattern-badge pattern-badge-yes" title="' + escapeHtml(c.email_pattern_source || 'discovered') + '">' + escapeHtml(c.email_pattern) + '</span>';
  } else {
    patternHtml = '<span class="pattern-badge pattern-badge-no">— none —</span>';
  }

  // Website cell
  const websiteHtml = c.website
    ? '<a href="' + escapeHtml(c.website) + '" target="_blank" title="' + escapeHtml(c.website) + '" style="color:#38bdf8;">' + escapeHtml(extractDomain(c.website)) + '</a>'
    : '<span style="color:#ef4444;font-size:0.7rem;">missing</span>';

  // Type display
  const typeDisplay = escapeHtml(formatBusinessType(c));

  // Build action buttons as compact icon-only with title for hover
  let actionsHtml;
  if (c.email_pattern) {
    actionsHtml =
      '<button class="btn btn-sm btn-orange" data-action="edit-pattern" title="Edit/validate email pattern">&#9998;</button>'
      + '<button class="btn btn-sm btn-red" data-action="clear-pattern" title="Clear email pattern">&#128465;</button>';
  } else {
    actionsHtml =
      '<button class="btn btn-sm btn-slate" data-action="discover-pattern" title="Discover email pattern via search">D</button>'
      + '<button class="btn btn-sm btn-orange" data-action="edit-pattern" title="Enter email pattern manually">&#9998;</button>';
  }
  actionsHtml +=
    '<button class="btn btn-sm btn-green" data-action="find-contacts" title="Find contacts for this company">&#128100;</button>'
    + '<button class="btn btn-sm btn-blue" data-action="get-emails" title="Derive emails from pattern">&#9993;</button>'
    + '<button class="btn btn-sm btn-amber" data-action="export-patterns" title="Export email patterns">&#8681;</button>';

  if (c.is_deleted) {
    // is_deleted no longer used — all deletes are permanent
  } else {
    actionsHtml += '<button class="btn btn-sm btn-red" data-action="delete-company" title="Permanently delete this company">&#10005;</button>';
  }

  // Build full row as a single innerHTML (avoids DOM/innerHTML mixing)
  tr.innerHTML =
    '<td style="text-align:center;"><input type="checkbox" class="company-cb" data-company-id="' + c.id + '"' + cbChecked + ' /></td>'
    + '<td style="font-weight:600;" title="' + escapeHtml(c.name) + '">' + escapeHtml(c.name) + '</td>'
    + '<td>' + escapeHtml(c.city || '') + '</td>'
    + '<td>' + escapeHtml(c.state || '') + '</td>'
    + '<td>' + typeDisplay + '</td>'
    + '<td>' + websiteHtml + '</td>'
    + '<td>' + patternHtml + '</td>'
    + '<td style="text-align:center;">' + (c.contact_count || 0) + '</td>'
    + '<td style="overflow:visible;"><div class="action-group">' + actionsHtml + '</div></td>';

  // Wire checkbox change listener
  const cb = tr.querySelector('.company-cb');
  cb.addEventListener('change', () => toggleCompanySelection(c.id, cb.checked));

  return tr;
}

function renderCompanies(companies) {
  const tbody = document.getElementById('companiesTable');
  tbody.innerHTML = '';
  if (!companies || companies.length === 0) {
    tbody.innerHTML = '<tr><td colspan="9" style="text-align:center;color:#94a3b8;padding:2rem;">No companies found. Try adjusting your filters.</td></tr>';
    return;
  }
  companies.forEach(c => {
    tbody.appendChild(renderRow(c));
  });
}

async function loadCompanies() {
  const industry = document.getElementById('filterIndustry').value.trim();
  const city = document.getElementById('filterCity').value.trim();
  const state = document.getElementById('filterState').value;
  const showDeleted = document.getElementById('showDeleted').checked;
  const perPage = parseInt(document.getElementById('perPage').value) || 20;
  let url = API_BASE + '/companies?limit=' + perPage;
  if (industry) url += '&industry=' + encodeURIComponent(industry);
  if (city) url += '&city=' + encodeURIComponent(city);
  if (state) url += '&state=' + encodeURIComponent(state);
  if (showDeleted) url += '&include_deleted=true';
  try {
    document.getElementById('pageInfo').textContent = 'Per page: ' + perPage;
    const r = await fetch(url, {headers: {'X-LF-Key': API_KEY}});
    const data = await r.json();
    const tbody = document.getElementById('companiesTable');
    tbody.innerHTML = '';
    companiesData = data.companies || [];
    if (companiesData.length === 0) {
      const tbody = document.getElementById('companiesTable');
      tbody.innerHTML = '<tr><td colspan="9" style="text-align:center;color:#94a3b8;padding:2rem;">No companies found. Try adjusting your filters.</td></tr>';
      return;
    }
    // Re-render with the current sort applied
    renderCompanies(applyCompanySort());
  } catch(e) {
    console.error('loadCompanies error:', e);
    showToast('Failed to load companies: ' + e.message, 'error');
  }
}

// Bulk selection management
function toggleCompanySelection(id, checked) {
  if (checked) {
    selectedCompanyIds.add(id);
  } else {
    selectedCompanyIds.delete(id);
  }
  updateBulkUI();
}

function toggleSelectAll() {
  const checked = document.getElementById('selectAll').checked;
  selectedCompanyIds.clear();
  if (checked) {
    companiesData.forEach(c => selectedCompanyIds.add(c.id));
  }
  // Update all visible checkboxes
  document.querySelectorAll('.company-cb').forEach(cb => {
    cb.checked = checked;
  });
  updateBulkUI();
}

function clearSelection() {
  selectedCompanyIds.clear();
  document.getElementById('selectAll').checked = false;
  document.querySelectorAll('.company-cb').forEach(cb => cb.checked = false);
  updateBulkUI();
}

function updateBulkUI() {
  const bar = document.getElementById('bulkActions');
  const count = selectedCompanyIds.size;
  document.getElementById('selectedCount').textContent = count + ' selected';
  bar.style.display = count > 0 ? 'flex' : 'none';
}

async function bulkDelete() {
  const ids = Array.from(selectedCompanyIds);
  if (ids.length === 0) return;
  if (!confirm('Permanently delete ' + ids.length + ' companies?\n\nThis cannot be undone. All contacts will also be deleted.')) return;
  try {
    const r = await fetch(API_BASE + '/companies/bulk-delete', {
      method: 'POST',
      headers: {'Content-Type': 'application/json', 'X-LF-Key': API_KEY},
      body: JSON.stringify({ids})
    });
    const d = await r.json();
    if (r.ok) {
      showToast(d.message, 'success');
      clearSelection();
      loadCompanies();
      loadStats();
    } else {
      showToast('Bulk delete failed: ' + (d.detail || 'unknown'), 'error');
    }
  } catch(e) {
    showToast('Bulk delete error: ' + e.message, 'error');
  }
}

async function bulkDiscover() {
  const ids = Array.from(selectedCompanyIds);
  if (ids.length === 0) return;
  if (!confirm('Run executive discovery for ' + ids.length + ' companies?\n\nThis may take a few minutes.')) return;
  showToast('Discovering executives for ' + ids.length + ' companies...', 'success');
  try {
    const r = await fetch(API_BASE + '/companies/bulk-discover', {
      method: 'POST',
      headers: {'Content-Type': 'application/json', 'X-LF-Key': API_KEY},
      body: JSON.stringify({ids})
    });
    const d = await r.json();
    if (r.ok) {
      showToast(d.message, 'success');
      clearSelection();
      loadCompanies();
    } else {
      showToast('Bulk discover failed: ' + (d.detail || 'unknown'), 'error');
    }
  } catch(e) {
    showToast('Bulk discover error: ' + e.message, 'error');
  }
}

// Add Company modal
function openAddCompanyModal() {
  document.getElementById('addCompanyModal').classList.add('active');
  document.getElementById('addCompanyName').value = '';
  document.getElementById('addCompanyWebsite').value = '';
  document.getElementById('addCompanyCity').value = '';
  document.getElementById('addCompanyState').value = 'CA';
  document.getElementById('addCompanyStreet').value = '';
  document.getElementById('addCompanyType').value = '';
  document.getElementById('addCompanyPhone').value = '';
  document.getElementById('addCompanyName').focus();
}

function closeAddCompanyModal() {
  document.getElementById('addCompanyModal').classList.remove('active');
}

async function submitAddCompany() {
  const name = document.getElementById('addCompanyName').value.trim();
  if (!name) { showToast('Company name is required', 'error'); return; }
  const data = {
    name,
    website: document.getElementById('addCompanyWebsite').value.trim(),
    city: document.getElementById('addCompanyCity').value.trim(),
    state: document.getElementById('addCompanyState').value.trim(),
    street: document.getElementById('addCompanyStreet').value.trim(),
    business_type: document.getElementById('addCompanyType').value,
    phone: document.getElementById('addCompanyPhone').value.trim(),
  };
  try {
    const r = await fetch(API_BASE + '/companies', {
      method: 'POST',
      headers: {'Content-Type': 'application/json', 'X-LF-Key': API_KEY},
      body: JSON.stringify(data)
    });
    const d = await r.json();
    if (r.ok) {
      showToast(name + ' created! (id=' + d.company_id + ')', 'success');
      closeAddCompanyModal();
      loadCompanies();
      loadStats();
    } else {
      showToast('Create failed: ' + (d.detail || 'unknown'), 'error');
    }
  } catch(e) {
    showToast('Create error: ' + e.message, 'error');
  }
}

// Event delegation on table
document.getElementById('companiesTable').addEventListener('click', async function(ev) {
  const btn = ev.target.closest('button[data-action]');
  if (!btn) return;
  const tr = btn.closest('tr');
  if (!tr) return;
  const company = JSON.parse(tr.dataset.companyJson);

  switch (btn.dataset.action) {
    case 'edit-pattern': {
      currentPatternCompanyId = company.id;
      currentPatternCompany = company;
      document.getElementById('patternModal').classList.add('active');
      document.getElementById('patCompanyName').textContent = company.name;
      document.getElementById('patCurrent').textContent = company.email_pattern || 'None';
      document.getElementById('patInput').value = company.email_pattern || '';
      document.getElementById('patSource').value = company.email_pattern_source || 'manual';
      break;
    }
    case 'clear-pattern': {
      if (!confirm('Clear email pattern for ' + company.name + '?')) return;
      const r = await fetch(API_BASE + '/company/' + company.id, {
        method: 'PATCH',
        headers: {'Content-Type': 'application/json', 'X-LF-Key': API_KEY},
        body: JSON.stringify({email_pattern: null, email_pattern_source: 'cleared', email_pattern_confidence: 0.0})
      });
      if (r.ok) {
        showToast('Pattern cleared', 'success');
        loadCompanies();
      } else {
        showToast('Failed to clear pattern', 'error');
      }
      break;
    }
    case 'discover-pattern': {
      btn.disabled = true;
      btn.textContent = 'Searching...';
      try {
        const r = await fetch(API_BASE + '/company/' + company.id + '/discover-email-pattern', {
          method: 'POST',
          headers: {'Content-Type': 'application/json', 'X-LF-Key': API_KEY},
          body: JSON.stringify({})
        });
        const d = await r.json();
        if (d.status === 'discovered' || d.status === 'derived') {
          showToast('Pattern: ' + d.pattern, 'success');
          loadCompanies();
        } else {
          showToast('Pattern discovery failed: ' + (d.detail || d.status), 'error');
          btn.disabled = false;
          btn.textContent = 'Discover';
        }
      } catch(e) {
        showToast('Discovery error: ' + e.message, 'error');
        btn.disabled = false;
        btn.textContent = 'Discover';
      }
      break;
    }
    case 'find-contacts': {
      if (!company.place_id) {
        showToast('No place_id for this company yet. Run a search first.', 'error');
        return;
      }
      if (!confirm('Find contacts for ' + company.name + '?\n\nThis runs the full discovery pipeline.')) return;
      btn.disabled = true;
      btn.textContent = 'Searching...';
      try {
        const r = await fetch(API_BASE + '/discover/' + company.place_id + '/executives', {
          method: 'POST',
          headers: {'Content-Type': 'application/json', 'X-LF-Key': API_KEY},
          body: JSON.stringify({})
        });
        const d = await r.json();
        if (r.ok) {
          showToast('Found ' + (d.count || 0) + ' contacts for ' + company.name, 'success');
          loadCompanies();
        } else {
          showToast('Discovery failed: ' + (d.detail || 'unknown'), 'error');
          btn.disabled = false;
          btn.textContent = 'Find Contacts';
        }
      } catch(e) {
        showToast('Discovery error: ' + e.message, 'error');
        btn.disabled = false;
        btn.textContent = 'Find Contacts';
      }
      break;
    }
    case 'get-emails': {
      btn.disabled = true;
      btn.textContent = 'Deriving...';
      try {
        const r = await fetch(API_BASE + '/company/' + company.id + '/derive-emails', {
          method: 'POST',
          headers: {'Content-Type': 'application/json', 'X-LF-Key': API_KEY},
          body: JSON.stringify({})
        });
        const d = await r.json();
        if (d.status === 'derived') {
          showToast('Derived ' + d.emails_derived + ' emails', 'success');
          loadCompanies();
        } else {
          showToast('Email derivation failed: ' + (d.detail || d.status), 'error');
          btn.disabled = false;
          btn.textContent = 'Get Emails';
        }
      } catch(e) {
        showToast('Derivation error: ' + e.message, 'error');
        btn.disabled = false;
        btn.textContent = 'Get Emails';
      }
      break;
    }
    case 'export-patterns': {
      window.open(API_BASE + '/company/' + company.id + '/email-patterns', '_blank');
      showToast('Exporting patterns for ' + company.name, 'success');
      break;
    }
    case 'delete-company': {
      if (!confirm('Permanently delete "' + company.name + '"?\n\nThis cannot be undone. All contacts will also be deleted.')) return;
      try {
        const r = await fetch(API_BASE + '/company/' + company.id, {
          method: 'DELETE',
          headers: {'X-LF-Key': API_KEY}
        });
        if (r.ok) {
          showToast(company.name + ' deleted', 'success');
          // Immediate row removal
          tr.style.transition = 'opacity 0.3s';
          tr.style.opacity = '0';
          setTimeout(() => { tr.remove(); loadCompanies(); }, 350);
        } else {
          const d = await r.json();
          showToast('Delete failed: ' + (d.detail || 'unknown'), 'error');
        }
      } catch(e) {
        showToast('Delete error: ' + e.message, 'error');
      }
      break;
    }
  }
});

// Modal handlers
document.getElementById('patCancelBtn').addEventListener('click', function() {
  document.getElementById('patternModal').classList.remove('active');
  currentPatternCompanyId = null;
  currentPatternCompany = null;
});

document.getElementById('patSaveBtn').addEventListener('click', async function() {
  if (!currentPatternCompanyId) return;
  const pattern = document.getElementById('patInput').value.trim();
  const source = document.getElementById('patSource').value;
  if (!pattern) {
    showToast('Please enter a pattern', 'error');
    return;
  }
  const r = await fetch(API_BASE + '/company/' + currentPatternCompanyId, {
    method: 'PATCH',
    headers: {'Content-Type': 'application/json', 'X-LF-Key': API_KEY},
    body: JSON.stringify({email_pattern: pattern, email_pattern_source: source, email_pattern_confidence: 1.0})
  });
  if (r.ok) {
    showToast('Pattern saved and validated', 'success');
    document.getElementById('patternModal').classList.remove('active');
    currentPatternCompanyId = null;
    currentPatternCompany = null;
    loadCompanies();
  } else {
    showToast('Failed to save pattern', 'error');
  }
});

// Filter button
document.getElementById('filterBtn').addEventListener('click', loadCompanies);

// Show Deleted toggle
document.getElementById('showDeleted').addEventListener('change', loadCompanies);

// Init
loadStats();
loadCompanyDropdowns();
loadCompanies();
</script>
