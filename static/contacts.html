<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8"/>
<meta name="viewport" content="width=device-width, initial-scale=1.0"/>
<title>Lead Finder - Contacts</title>
<link rel="icon" type="image/svg+xml" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 64 64'%3E%3Crect width='64' height='64' rx='12' fill='%230f172a'/%3E%3Ctext x='32' y='44' text-anchor='middle' font-family='-apple-system,BlinkMacSystemFont,sans-serif' font-weight='800' font-size='32' fill='%2338bdf8'%3ELS%3C/text%3E%3C/svg%3E"/>
<style>
*{box-sizing:border-box;margin:0;padding:0}
body{font-family:-apple-system,BlinkMacSystemFont,'Segoe UI',Roboto,sans-serif;background:#0f172a;color:#f1f5f9;min-height:100vh}
.app{max-width:1600px;margin:0 auto;padding:2rem}
.nav{display:flex;gap:0.5rem;margin-bottom:2rem;flex-wrap:wrap}
.nav a{padding:0.6rem 1.2rem;background:#1e293b;color:#94a3b8;text-decoration:none;border-radius:6px;font-size:0.9rem;transition:all 0.2s}
.nav a:hover,.nav a.active{background:#38bdf8;color:#0f172a;font-weight:600}
.card{background:#1e293b;border-radius:10px;padding:1.5rem;margin-bottom:1.5rem}
.card h2{font-size:1rem;color:#94a3b8;margin-bottom:1rem;text-transform:uppercase;letter-spacing:0.05em}
.stats-grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(150px,1fr));gap:1rem;margin-bottom:1.5rem}
.stat-card{background:#1e293b;border-radius:10px;padding:1.2rem;text-align:center}
.stat-value{font-size:2rem;font-weight:700;color:#38bdf8}
.stat-label{font-size:0.8rem;color:#64748b;text-transform:uppercase;margin-top:0.3rem}
.filter-row{display:flex;gap:0.75rem;flex-wrap:wrap;margin-bottom:1rem;align-items:center}
input,select,textarea{padding:0.5rem 0.8rem;background:#0f172a;border:1px solid #334155;color:#f1f5f9;border-radius:6px;font-size:0.8rem;min-width:140px}
input:focus,select:focus,textarea:focus{outline:none;border-color:#38bdf8}
.btn{padding:0.5rem 1.2rem;background:#38bdf8;color:#0f172a;border:none;border-radius:6px;font-size:0.85rem;font-weight:600;cursor:pointer}
.btn-sm{padding:2px 5px;font-size:0.7rem;border-radius:3px;cursor:pointer;border:none;font-weight:600;min-width:20px;min-height:20px;text-align:center;line-height:1}
.btn-red{background:#ef4444;color:#fff}
.btn-green{background:#22c55e;color:#fff}
.btn-orange{background:#f59e0b;color:#fff}
.btn-blue{background:#38bdf8;color:#0f172a}
.btn-purple{background:#8b5cf6;color:#fff}
.btn-slate{background:#334155;color:#94a3b8}
.table-wrap{overflow-x:auto}
table{width:100%;border-collapse:collapse;font-size:0.8rem;table-layout:fixed}
th{text-align:left;padding:0.5rem 0.6rem;background:#0f172a;color:#64748b;font-weight:600;font-size:0.7rem;text-transform:uppercase;white-space:nowrap;overflow:hidden}
td{padding:0.5rem 0.6rem;border-bottom:1px solid #1e293b;overflow:hidden;text-overflow:ellipsis}
tr:hover td{background:#1e293b}
/* Column widths — 13 columns total (checkbox + 12 data) */
th:nth-child(1),td:nth-child(1){width:30px;text-align:center;overflow:visible}
th:nth-child(2),td:nth-child(2){width:12%} /* Name */
th:nth-child(3),td:nth-child(3){width:12%} /* Title */
th:nth-child(4),td:nth-child(4){width:10%} /* Company */
th:nth-child(5),td:nth-child(5){width:20%;overflow:visible;word-break:break-all} /* Email — widened for full-length emails */
th:nth-child(6),td:nth-child(6){width:9%}  /* Pattern */
th:nth-child(7),td:nth-child(7){width:5%}  /* Found */
th:nth-child(8),td:nth-child(8){width:4%}  /* Conf */
th:nth-child(9),td:nth-child(9){width:4%}  /* Local */
th:nth-child(10),td:nth-child(10){width:3%} /* Score */
th:nth-child(11),td:nth-child(11){width:4%} /* LinkedIn */
th:nth-child(12),td:nth-child(12){width:13%;overflow:visible} /* Actions */
.badge{display:inline-block;padding:0.15rem 0.4rem;border-radius:4px;font-size:0.7rem;font-weight:600}
.badge-local{background:#22c55e33;color:#22c55e}
.badge-hq{background:#f59e0b33;color:#f59e0b}
.company-group-header{background:#0f172a;color:#38bdf8;font-weight:700;font-size:0.85rem}
.company-group-header td{padding:0.5rem 0.6rem;border-bottom:2px solid #334155;overflow:visible}
.action-group{display:inline-flex;gap:2px;flex-wrap:nowrap;align-items:center}
/* Modal */
.modal-overlay{position:fixed;inset:0;background:rgba(0,0,0,0.7);display:none;align-items:center;justify-content:center;z-index:1000}
.modal-overlay.active{display:flex}
.modal{background:#1e293b;border-radius:10px;padding:2rem;width:90%;max-width:500px;max-height:90vh;overflow-y:auto}
.modal h3{margin-bottom:1rem;color:#f1f5f9}
.modal-row{margin-bottom:1rem}
.modal-row label{display:block;font-size:0.8rem;color:#94a3b8;margin-bottom:0.3rem}
.modal-row input,.modal-row textarea,.modal-row select{width:100%}
.modal-row textarea{min-height:80px;resize:vertical}
.modal-actions{display:flex;gap:0.75rem;justify-content:flex-end;margin-top:1.5rem}
/* Toast */
.toast{position:fixed;bottom:2rem;right:2rem;padding:1rem 1.5rem;border-radius:8px;font-size:0.9rem;font-weight:600;z-index:2000;transform:translateY(150%);transition:transform 0.3s}
.toast.show{transform:translateY(0)}
.toast-success{background:#22c55e;color:#fff}
.toast-error{background:#ef4444;color:#fff}
.toast-info{background:#38bdf8;color:#0f172a}
.truncate{max-width:200px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;display:block}
.page-controls{display:flex;align-items:center;gap:0.5rem;margin-bottom:0.5rem;flex-wrap:wrap}
.page-controls select{padding:0.3rem 0.5rem;font-size:0.8rem;min-width:auto}
.page-info{color:#94a3b8;font-size:0.8rem}
/* Bulk actions */
.bulk-bar{display:none;align-items:center;gap:0.5rem;margin-bottom:0.5rem;padding:0.6rem 1rem;background:#1e293b;border-radius:6px;border:1px solid #334155}
.bulk-bar.active{display:flex}
.bulk-count{color:#38bdf8;font-size:0.85rem;font-weight:600}
/* Checkboxes — same as companies page */
input[type="checkbox"]{accent-color:#38bdf8;width:16px;height:16px;cursor:pointer;padding:0;background:transparent;border:none;min-width:0}
/* Sortable column headers */
th.sortable{cursor:pointer;user-select:none;position:relative;padding-right:1.1rem;transition:background 0.15s}
th.sortable:hover{background:rgba(56,189,248,0.15);color:#38bdf8}
th.sortable::after{content:'⇅';position:absolute;right:0.4rem;top:50%;transform:translateY(-50%);color:#475569;font-size:0.75rem;opacity:0.5}
th.sortable.sort-asc::after{content:'▲';color:#38bdf8;opacity:1}
th.sortable.sort-desc::after{content:'▼';color:#38bdf8;opacity:1}
</style>
</head>
<body>
<div class="app">
<div class="nav">
<a href="/finder/">Search</a>
<a href="/finder/sessions">Sessions</a>
<a href="/finder/companies">Companies</a>
<a href="/finder/contacts" class="active">Contacts</a>
<a href="/finder/emails">&#9993; Email Validation</a>
<a href="/finder/audit">Audit</a>
<span style="margin-left:auto;display:flex;gap:0.5rem;align-items:center;font-size:0.8rem;">
  <span style="color:#22c55e;">P1-P5 ✓</span>
  <span style="background:#22c55e33;color:#22c55e;padding:0.3rem 0.6rem;border-radius:4px;font-weight:600;">QC-10 AI ✓</span>
</span>
</div>

<div class="stats-grid">
<div class="stat-card"><div class="stat-value" id="statCompanies">-</div><div class="stat-label">Companies</div></div>
<div class="stat-card"><div class="stat-value" id="statContacts">-</div><div class="stat-label">Contacts</div></div>
<div class="stat-card"><div class="stat-value" id="statSessions">-</div><div class="stat-label">Sessions</div></div>
</div>

<div class="card">
<h2>Contacts</h2>
<div class="filter-row">
<label style="font-size:0.8rem;color:#94a3b8;">Group: <select id="groupBy" onchange="loadContacts()"><option value="company">Company</option><option value="none">Flat List</option></select></label>
<label style="font-size:0.8rem;color:#94a3b8;">Sort: <select id="sortBy" onchange="onSortDropdownChange()"><option value="confidence">By Confidence</option><option value="recent">Most Recent</option></select></label>
<label style="font-size:0.8rem;color:#94a3b8;">Company: <select id="filterCompany" onchange="loadContacts()"><option value="">All</option></select></label>
<label style="font-size:0.8rem;color:#94a3b8;">Title: <select id="filterTitle" onchange="loadContacts()"><option value="">All</option></select></label>
<label style="font-size:0.8rem;color:#94a3b8;">City: <select id="filterCity" onchange="loadContacts()"><option value="">All</option></select></label>
<input id="filterCompanyText" placeholder="Or type company..." style="min-width:120px;" />
<input id="filterTitleText" placeholder="Or type title..." style="min-width:100px;" />
<button class="btn" onclick="loadContacts()">Filter</button>
<button class="btn btn-green" onclick="openAddContact()">+ Add Contact</button>
</div>
<div class="page-controls">
<label style="font-size:0.8rem;color:#94a3b8;">Per page: <select id="perPage" onchange="loadContacts()">
<option value="20">20</option><option value="50">50</option><option value="100">100</option><option value="200">200</option>
</select></label>
<span class="page-info" id="pageInfo"></span>
</div>
<div class="bulk-bar" id="bulkBar">
<span class="bulk-count" id="bulkCount">0 selected</span>
<button class="btn btn-sm btn-red" onclick="bulkDelete()" title="Permanently delete selected contacts">&#10005; Delete</button>
<button class="btn btn-sm btn-purple" onclick="bulkValidate()" title="SMTP-validate emails for selected contacts">&#9889; Validate Emails</button>
<button class="btn btn-sm btn-slate" onclick="clearSelection()" title="Deselect all">Clear</button>
</div>
<div class="table-wrap">
<table>
<thead><tr>
<th><input type="checkbox" id="selectAll" onchange="toggleSelectAll()" title="Select all visible contacts" /></th>
<th class="sortable" data-sort-key="full_name">Name</th>
<th class="sortable" data-sort-key="title">Title</th>
<th class="sortable" data-sort-key="company_name">Company</th>
<th class="sortable" data-sort-key="email">Email</th>
<th class="sortable" data-sort-key="company_email_pattern">Pattern</th>
<th class="sortable" data-sort-key="found_at">Found</th>
<th>Conf</th>
<th>Local</th>
<th class="sortable" data-sort-key="confidence_score">Score</th>
<th>LinkedIn</th>
<th>Actions</th>
</tr></thead>
<tbody id="contactsTable"></tbody>
</table>
</div>
</div>
</div>

<!-- Add Contact Modal -->
<div class="modal-overlay" id="addModal">
<div class="modal">
<h3>Add Contact</h3>
<div class="modal-row"><label>Company</label><select id="addCompany"></select></div>
<div class="modal-row"><label>Full Name *</label><input id="addName" type="text" /></div>
<div class="modal-row"><label>Title *</label><input id="addTitle" type="text" /></div>
<div class="modal-row"><label>LinkedIn URL</label><input id="addLinkedIn" type="url" /></div>
<div class="modal-row"><label>Notes</label><textarea id="addNotes"></textarea></div>

<button class="btn btn-orange btn-sm" onclick="closeAddModal()">Cancel</button>
<button class="btn btn-sm" onclick="saveAddContact()">Add Contact</button>
</div>
</div>
</div>

<!-- Edit Modal -->
<div class="modal-overlay" id="editModal">
<div class="modal">
<h3>Edit Contact</h3>
<div class="modal-row"><label>Full Name</label><input id="editName" type="text" /></div>
<div class="modal-row"><label>Title</label><input id="editTitle" type="text" /></div>
<div class="modal-row"><label>LinkedIn URL</label><input id="editLinkedIn" type="url" /></div>
<div class="modal-row"><label>Company</label><select id="editCompany"><option value="">— Select Company —</option></select></div>
<div class="modal-row"><label>Notes</label><textarea id="editNotes"></textarea></div>
<div class="modal-actions">
<button class="btn btn-orange btn-sm" onclick="closeEditModal()">Cancel</button>
<button class="btn btn-sm" onclick="saveEdit()">Save</button>
</div>
</div>
</div>

<!-- Toast -->
<div class="toast" id="toast"></div>

<script>
const API_BASE = '/api';
const API_KEY = 'lf_key_P9xZq3RvLm7YwT2hJm8FvNu4BcDEs6';
let currentEditId = null;
let allContacts = [];
let companyOptions = [];
let currentSort = { key: 'confidence_score', dir: 'desc' };
let selectedIds = new Set();

// ── Sort helpers ──────────────────────────────────────────────────────────
function _compareValues(a, b, dir) {
  const aNull = a === null || a === undefined || a === '';
  const bNull = b === null || b === undefined || b === '';
  if (aNull && bNull) return 0;
  if (aNull) return 1;
  if (bNull) return -1;
  if (typeof a === 'number' && typeof b === 'number') return dir === 'asc' ? a - b : b - a;
  const sa = String(a).toLowerCase(), sb = String(b).toLowerCase();
  if (sa < sb) return dir === 'asc' ? -1 : 1;
  if (sa > sb) return dir === 'asc' ? 1 : -1;
  return 0;
}

function sortContacts(contacts, key, dir) {
  return contacts.slice().sort((a, b) => _compareValues(a ? a[key] : null, b ? b[key] : null, dir));
}

function applyCurrentSort() { return sortContacts(allContacts, currentSort.key, currentSort.dir); }

function handleSortClick(key) {
  if (currentSort.key === key) { currentSort.dir = currentSort.dir === 'asc' ? 'desc' : 'asc'; }
  else { currentSort.key = key; const nk = ['confidence_score','found_at','company_email_confidence']; currentSort.dir = nk.includes(key) ? 'desc' : 'asc'; }
  document.querySelectorAll('th.sortable').forEach(th => { th.classList.remove('sort-asc','sort-desc'); if (th.getAttribute('data-sort-key') === key) th.classList.add(currentSort.dir === 'asc' ? 'sort-asc' : 'sort-desc'); });
  renderContacts(applyCurrentSort(), parseInt(document.getElementById('perPage').value)||20, document.getElementById('groupBy').value);
}

document.addEventListener('DOMContentLoaded', () => {
  document.querySelectorAll('th.sortable').forEach(th => th.addEventListener('click', () => handleSortClick(th.getAttribute('data-sort-key'))));
  const def = document.querySelector('th.sortable[data-sort-key="'+currentSort.key+'"]');
  if (def) def.classList.add('sort-desc');
});

function onSortDropdownChange() {
  const v = document.getElementById('sortBy').value;
  currentSort.key = v === 'recent' ? 'found_at' : 'confidence_score';
  currentSort.dir = 'desc';
  document.querySelectorAll('th.sortable').forEach(th => { th.classList.remove('sort-asc','sort-desc'); if (th.getAttribute('data-sort-key') === currentSort.key) th.classList.add('sort-desc'); });
  loadContacts();
}

// ── Bulk selection ────────────────────────────────────────────────────────
function toggleContactSelection(id, checked) { checked ? selectedIds.add(id) : selectedIds.delete(id); updateBulkUI(); }
function toggleSelectAll() { const c = document.getElementById('selectAll').checked; selectedIds.clear(); if (c) allContacts.forEach(ct => selectedIds.add(ct.id)); document.querySelectorAll('.ct-cb').forEach(cb => cb.checked = c); updateBulkUI(); }
function clearSelection() { selectedIds.clear(); document.getElementById('selectAll').checked = false; document.querySelectorAll('.ct-cb').forEach(cb => cb.checked = false); updateBulkUI(); }
function updateBulkUI() { const n = selectedIds.size; document.getElementById('bulkCount').textContent = n + ' selected'; document.getElementById('bulkBar').classList.toggle('active', n > 0); }

async function bulkDelete() {
  const ids = Array.from(selectedIds);
  if (!ids.length) return;
  if (!confirm('Permanently delete ' + ids.length + ' contacts?\n\nThis cannot be undone.')) return;
  try {
    const r = await fetch(API_BASE+'/contacts/bulk-delete', { method:'POST', headers:{'Content-Type':'application/json','X-LF-Key':API_KEY}, body:JSON.stringify({ids}) });
    const d = await r.json();
    if (r.ok) { showToast(d.message, 'success'); clearSelection(); loadContacts(); loadStats(); }
    else showToast('Bulk delete failed: '+(d.detail||'unknown'), 'error');
  } catch(e) { showToast('Bulk delete error: '+e.message, 'error'); }
}

async function bulkValidate() {
  const ids = Array.from(selectedIds);
  if (!ids.length) return;
  if (!confirm('SMTP-validate emails for ' + ids.length + ' contacts?\n\nThis runs in the background.')) return;
  try {
    const r = await fetch(API_BASE+'/contacts/bulk-validate-emails', { method:'POST', headers:{'Content-Type':'application/json','X-LF-Key':API_KEY}, body:JSON.stringify({ids}) });
    const d = await r.json();
    if (r.ok) { showToast(d.message, 'success'); clearSelection(); }
    else showToast('Validate failed: '+(d.detail||d.message||'unknown'), 'error');
  } catch(e) { showToast('Validate error: '+e.message, 'error'); }
}

// ── Helpers ───────────────────────────────────────────────────────────────
function escapeHtml(s) { return s == null ? '' : String(s).replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;').replace(/'/g,'&#39;'); }
function showToast(msg, type) { const t = document.getElementById('toast'); t.textContent = msg; t.className = 'toast toast-'+type+' show'; setTimeout(()=>t.classList.remove('show'), 3500); }

// ── Data loading ──────────────────────────────────────────────────────────
async function loadStats() { try { const r = await fetch(API_BASE+'/stats',{headers:{'X-LF-Key':API_KEY}}); if (!r.ok) return; const d = await r.json(); document.getElementById('statCompanies').textContent = d.companies||0; document.getElementById('statContacts').textContent = d.contacts||0; document.getElementById('statSessions').textContent = d.sessions||0; } catch(e) {} }

async function loadDropdowns() {
  try {
    const r = await fetch(API_BASE+'/contacts/dropdowns',{headers:{'X-LF-Key':API_KEY}});
    if (!r.ok) return;
    const d = await r.json();
    document.getElementById('filterCompany').innerHTML = '<option value="">All Companies</option>' + (d.companies||[]).map(c => '<option value="'+escapeHtml(c)+'">'+escapeHtml(c)+'</option>').join('');
    document.getElementById('filterTitle').innerHTML = '<option value="">All Titles</option>' + (d.titles||[]).map(t => '<option value="'+escapeHtml(t)+'">'+escapeHtml(t)+'</option>').join('');
    document.getElementById('filterCity').innerHTML = '<option value="">All Cities</option>' + (d.cities||[]).map(c => '<option value="'+escapeHtml(c)+'">'+escapeHtml(c)+'</option>').join('');
  } catch(e) {}
}

async function loadContacts() {
  const company = document.getElementById('filterCompany').value;
  const title = document.getElementById('filterTitle').value;
  const city = document.getElementById('filterCity').value;
  const compText = document.getElementById('filterCompanyText').value.trim();
  const titleText = document.getElementById('filterTitleText').value.trim();
  const perPage = parseInt(document.getElementById('perPage').value) || 20;
  const groupBy = document.getElementById('groupBy').value;
  const sortBy = document.getElementById('sortBy').value;
  let url = API_BASE+'/contacts?limit=500&derive_emails=true';
  if (compText && !company) url += '&company_name='+encodeURIComponent(compText);
  else if (company) url += '&company_name='+encodeURIComponent(company);
  if (titleText && !title) url += '&title='+encodeURIComponent(titleText);
  else if (title) url += '&title='+encodeURIComponent(title);
  if (city) url += '&city='+encodeURIComponent(city);
  if (sortBy) url += '&sort='+encodeURIComponent(sortBy);
  try {
    const r = await fetch(url, {headers:{'X-LF-Key':API_KEY}});
    const data = await r.json();
    allContacts = data.contacts || [];
    renderContacts(applyCurrentSort(), perPage, groupBy);
  } catch(e) { showToast('Failed to load contacts', 'error'); }
}

// ── Render ────────────────────────────────────────────────────────────────
function renderContacts(contacts, perPage, groupBy) {
  const tbody = document.getElementById('contactsTable');
  tbody.innerHTML = '';
  const pageInfo = document.getElementById('pageInfo');
  if (contacts.length === 0) { pageInfo.textContent = 'No contacts found'; return; }

  let grouped = {};
  if (groupBy === 'company') { for (const ct of contacts) { const k = ct.company_name||'Unknown'; if (!grouped[k]) grouped[k] = []; grouped[k].push(ct); } }
  else { grouped = {'': contacts}; }

  const companyKeys = Object.keys(grouped).sort();
  const total = contacts.length;
  pageInfo.textContent = total + ' contacts' + (total > perPage ? ' (showing '+perPage+')' : '');

  let count = 0;
  const maxShow = Math.min(perPage, total);

  for (const companyName of companyKeys) {
    const group = grouped[companyName];
    const companyId = group[0]?.company_id || '';
    for (const ct of group) {
      if (count >= maxShow) break;
      count++;
      // Group header
      if (count === 1 || (groupBy === 'company' && ct === group[0])) {
        const hr = document.createElement('tr');
        hr.className = 'company-group-header';
        hr.innerHTML = '<td colspan="1">&#9654;</td><td colspan="11" style="overflow:visible;">' + escapeHtml(companyName) + ' (' + group.length + ')</td><td style="overflow:visible;"><button class="btn-sm btn-green" onclick="openAddContactForCompany('+companyId+',\''+escapeHtml(companyName).replace(/'/g,"\\'")+'\')" title="Add contact to '+escapeHtml(companyName)+'">+ Add</button></td>';
        tbody.appendChild(hr);
      }

      const tr = document.createElement('tr');
      tr.dataset.contactId = ct.id;

      // Email cell
      const emailHtml = ct.email
        ? '<span style="color:#22c55e;font-size:0.75rem;" title="'+escapeHtml(ct.email)+'">'+escapeHtml(ct.email)+'</span>'
        : (ct.company_email_pattern ? '<span style="color:#94a3b8;font-size:0.7rem;">(derivable)</span>' : '<span style="color:#64748b;">—</span>');

      // Pattern cell
      const pat = ct.company_email_pattern || '';
      const patConf = ct.company_email_confidence || 0;
      const patHtml = pat
        ? (patConf >= 1.0
          ? '<span style="color:#22c55e;font-size:0.7rem;" title="Validated pattern ('+(patConf*100).toFixed(0)+'%)">✓ '+escapeHtml(pat)+'</span>'
          : '<span style="color:#f59e0b;font-size:0.7rem;" title="Estimated pattern ('+(patConf*100).toFixed(0)+'%)">~ '+escapeHtml(pat)+'</span>')
        : '<span style="color:#64748b;font-size:0.7rem;">—</span>';

      // Found date
      let foundDisplay = '<span style="color:#64748b;">—</span>';
      if (ct.found_at) { const d = (ct.found_at||'').substring(0,10); foundDisplay = '<span style="color:#94a3b8;font-size:0.75rem;" title="'+escapeHtml(ct.found_at)+'">'+escapeHtml(d)+'</span>'; }

      // Confidence
      const conf = (ct.confidence_score||0).toFixed(1);

      // Local badge
      const badge = ct.is_local ? '<span class="badge badge-local">L</span>' : '<span class="badge badge-hq">HQ</span>';

      // LinkedIn
      const li = ct.linkedin_url ? '<a href="'+escapeHtml(ct.linkedin_url)+'" target="_blank" style="color:#38bdf8;text-decoration:none;" title="'+escapeHtml(ct.linkedin_url)+'">&#128279;</a>' : '<span style="color:#64748b;">—</span>';

      // Title
      const titleDisplay = ct.title || '-';

      // Pattern confidence string
      const patConfStr = pat ? (patConf*100).toFixed(0)+'%' : '';

      // Checkbox
      const cbChecked = selectedIds.has(ct.id) ? ' checked' : '';

      // Action buttons — compact icons with tooltips, no spaces between
      let actions = '';
      actions += '<button class="btn-sm btn-green" onclick="openEdit('+ct.id+')" title="Edit contact">&#9998;</button>';
      actions += '<button class="btn-sm btn-red" onclick="deleteContact('+ct.id+')" title="Permanently delete contact">&#10005;</button>';
      actions += '<button class="btn-sm btn-orange" onclick="exportContact('+ct.id+')" title="Export as CSV">&#8681;</button>';
      if (!ct.email && ct.company_email_pattern) {
        actions += '<button class="btn-sm btn-blue" onclick="deriveEmail('+ct.id+')" title="Derive email from pattern">&#9993;</button>';
      }
      actions += '<button class="btn-sm btn-purple" onclick="validateEmail('+ct.id+')" title="SMTP-validate this email">&#9889;</button>';
      actions += '<button class="btn-sm btn-blue" onclick="verifyTitle('+ct.id+')" title="AI-verify title" style="background:#8b5cf6;">&#9733;</button>';

      tr.innerHTML =
        '<td><input type="checkbox" class="ct-cb" data-id="'+ct.id+'"'+cbChecked+' /></td>'
        + '<td style="font-weight:600;" title="'+escapeHtml(ct.full_name)+'">'+escapeHtml(ct.full_name)+'</td>'
        + '<td title="'+escapeHtml(ct.title||'')+'">'+escapeHtml(titleDisplay)+'</td>'
        + '<td title="'+escapeHtml(ct.company_name||'')+'">'+escapeHtml(ct.company_name||'')+'</td>'
        + '<td>'+emailHtml+'</td>'
        + '<td>'+patHtml+'</td>'
        + '<td>'+foundDisplay+'</td>'
        + '<td style="color:#94a3b8;font-size:0.75rem;">'+patConfStr+'</td>'
        + '<td>'+badge+'</td>'
        + '<td style="text-align:center;">'+conf+'</td>'
        + '<td>'+li+'</td>'
        + '<td style="overflow:visible;"><div class="action-group">'+actions+'</div></td>';

      // Wire checkbox
      tr.querySelector('.ct-cb').addEventListener('change', function() { toggleContactSelection(ct.id, this.checked); });
      tbody.appendChild(tr);
    }
    if (count >= maxShow) break;
  }
}

// ── Contact actions ───────────────────────────────────────────────────────
async function deriveEmail(contactId) {
  try {
    const r = await fetch(API_BASE+'/contact/'+contactId+'/derive-email', { method:'POST', headers:{'X-LF-Key':API_KEY} });
    const d = await r.json();
    if (d.status === 'ok') { showToast('Email derived: '+d.email, 'success'); loadContacts(); }
    else showToast(d.reason || 'Failed to derive email', 'error');
  } catch(e) { showToast('Derive error: '+e.message, 'error'); }
}

async function validateEmail(contactId) {
  try {
    const r = await fetch(API_BASE+'/contact/'+contactId+'/validate-email', { method:'POST', headers:{'X-LF-Key':API_KEY} });
    const d = await r.json();
    if (d.status === 'ok') { showToast('Email: '+d.email+' → '+d.validation, 'success'); loadContacts(); }
    else showToast(d.message || d.detail || 'Validation failed', 'error');
  } catch(e) { showToast('Validate error: '+e.message, 'error'); }
}

async function verifyTitle(contactId) {
  showToast('AI verifying title...', 'info');
  try {
    const r = await fetch(API_BASE+'/contact/'+contactId+'/verify-title', { method:'POST', headers:{'X-LF-Key':API_KEY} });
    const d = await r.json();
    if (d.status === 'ok') { showToast('Title: "'+d.previous_title+'" → "'+d.title+'" ('+(d.confidence*100).toFixed(0)+'%)', 'success'); loadContacts(); }
    else showToast(d.reason || 'Title verification failed', 'error');
  } catch(e) { showToast('Verify error: '+e.message, 'error'); }
}

async function deleteContact(id) {
  const ct = allContacts.find(c => c.id === id);
  const name = ct ? ct.full_name : 'this contact';
  if (!confirm('Permanently delete "'+name+'"?')) return;
  const r = await fetch(API_BASE+'/contact/'+id, { method:'DELETE', headers:{'X-LF-Key':API_KEY} });
  if (r.ok) { showToast('Contact deleted', 'success'); loadContacts(); loadStats(); }
  else showToast('Failed to delete', 'error');
}

async function exportContact(id) {
  const ct = allContacts.find(c => c.id === id);
  if (!ct) return;
  const rows = [['Full Name','Title','Company','Email','LinkedIn URL','Pattern','Confidence Score','Is Local','Data Provenance']];
  rows.push([ct.full_name||'',ct.title||'',ct.company_name||'',ct.email||'',ct.linkedin_url||'',ct.company_email_pattern||'',(ct.confidence_score||0).toFixed(2),ct.is_local?'YES':'NO',ct.data_provenance||'']);
  const csv = rows.map(e=>e.map(v=>'"'+String(v).replace(/"/g,'""')+'"').join(',')).join('\n');
  const blob = new Blob([csv],{type:'text/csv'});
  const link = document.createElement('a'); link.href = URL.createObjectURL(blob); link.download = 'contact_'+id+'.csv';
  document.body.appendChild(link); link.click(); document.body.removeChild(link);
  showToast('Exported '+ct.full_name, 'success');
}

// ── Modals ────────────────────────────────────────────────────────────────
async function loadCompanyOptions() { if (companyOptions.length > 0) return; const r = await fetch(API_BASE+'/companies?limit=500',{headers:{'X-LF-Key':API_KEY}}); const d = await r.json(); companyOptions = d.companies||[]; }

async function openEdit(id) {
  const ct = allContacts.find(c => c.id === id);
  if (!ct) return;
  currentEditId = id;
  await loadCompanyOptions();
  const sel = document.getElementById('editCompany');
  sel.innerHTML = '<option value="">— Select Company —</option>';
  for (const c of companyOptions) { sel.innerHTML += '<option value="'+c.id+'"'+(c.id===ct.company_id?' selected':'')+'>'+escapeHtml(c.name)+' ('+escapeHtml(c.city||'')+', '+escapeHtml(c.state||'')+')</option>'; }
  document.getElementById('editName').value = ct.full_name || '';
  document.getElementById('editTitle').value = ct.title || '';
  document.getElementById('editLinkedIn').value = ct.linkedin_url || '';
  document.getElementById('editNotes').value = ct.manual_notes || '';
  document.getElementById('editModal').classList.add('active');
}
function closeEditModal() { document.getElementById('editModal').classList.remove('active'); currentEditId = null; }
async function saveEdit() {
  if (!currentEditId) return;
  const companyId = document.getElementById('editCompany').value;
  const body = { full_name: document.getElementById('editName').value.trim(), title: document.getElementById('editTitle').value.trim(), linkedin_url: document.getElementById('editLinkedIn').value.trim(), manual_notes: document.getElementById('editNotes').value.trim() };
  if (companyId) body.company_id = parseInt(companyId);
  const r = await fetch(API_BASE+'/contact/'+currentEditId, { method:'PATCH', headers:{'Content-Type':'application/json','X-LF-Key':API_KEY}, body:JSON.stringify(body) });
  if (r.ok) { showToast('Contact updated', 'success'); closeEditModal(); loadContacts(); }
  else showToast('Failed to update', 'error');
}

let addCompanyId = null;
async function openAddContact() {
  addCompanyId = null;
  const sel = document.getElementById('addCompany');
  const r = await fetch(API_BASE+'/companies?limit=500',{headers:{'X-LF-Key':API_KEY}});
  const d = await r.json();
  sel.innerHTML = '<option value="">— Select Company —</option>' + (d.companies||[]).map(c => '<option value="'+c.id+'">'+escapeHtml(c.name)+' ('+escapeHtml(c.city||'')+', '+escapeHtml(c.state||'')+')</option>').join('');
  sel.value = '';
  document.getElementById('addName').value = '';
  document.getElementById('addTitle').value = '';
  document.getElementById('addLinkedIn').value = '';
  document.getElementById('addNotes').value = '';
  document.getElementById('addModal').classList.add('active');
}
async function openAddContactForCompany(companyId, companyName) {
  addCompanyId = companyId;
  const sel = document.getElementById('addCompany');
  if (sel.options.length <= 1) {
    const r = await fetch(API_BASE+'/companies?limit=500',{headers:{'X-LF-Key':API_KEY}});
    const d = await r.json();
    sel.innerHTML = '<option value="">— Select Company —</option>' + (d.companies||[]).map(c => '<option value="'+c.id+'">'+escapeHtml(c.name)+' ('+escapeHtml(c.city||'')+', '+escapeHtml(c.state||'')+')</option>').join('');
  }
  sel.value = companyId;
  document.getElementById('addName').value = '';
  document.getElementById('addTitle').value = '';
  document.getElementById('addLinkedIn').value = '';
  document.getElementById('addNotes').value = '';
  document.getElementById('addModal').classList.add('active');
}
function closeAddModal() { document.getElementById('addModal').classList.remove('active'); addCompanyId = null; }
async function saveAddContact() {
  const companyId = addCompanyId || document.getElementById('addCompany').value;
  const name = document.getElementById('addName').value.trim();
  const title = document.getElementById('addTitle').value.trim();
  const linkedin = document.getElementById('addLinkedIn').value.trim();
  const notes = document.getElementById('addNotes').value.trim();
  if (!companyId) { showToast('Select a company', 'error'); return; }
  if (!name) { showToast('Name is required', 'error'); return; }
  if (!title) { showToast('Title is required', 'error'); return; }
  try {
    const r = await fetch(API_BASE+'/company/'+companyId+'/contact', { method:'POST', headers:{'Content-Type':'application/json','X-LF-Key':API_KEY}, body:JSON.stringify({full_name:name,title,linkedin_url:linkedin,notes}) });
    const d = await r.json();
    if (d.status === 'ok') { showToast('Contact added', 'success'); closeAddModal(); loadContacts(); loadStats(); }
    else showToast(d.detail || 'Failed to add', 'error');
  } catch(e) { showToast('Error: '+e.message, 'error'); }
}

document.getElementById('addModal').addEventListener('click', function(e) { if (e.target === this) closeAddModal(); });
document.getElementById('editModal').addEventListener('click', function(e) { if (e.target === this) closeEditModal(); });

loadStats(); loadDropdowns(); loadContacts();
</script>
