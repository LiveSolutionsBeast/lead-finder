<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8"/>
<meta name="viewport" content="width=device-width, initial-scale=1.0"/>
<title>Lead Finder - Contacts</title>
<link rel="icon" type="image/svg+xml" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 64 64'%3E%3Crect width='64' height='64' rx='12' fill='%230f172a'/%3E%3Ctext x='32' y='44' text-anchor='middle' font-family='-apple-system,BlinkMacSystemFont,sans-serif' font-weight='800' font-size='32' fill='%2338bdf8'%3ELS%3C/text%3E%3C/svg%3E"/>
<style>
*{box-sizing:border-box;margin:0;padding:0}
body{font-family:-apple-system,BlinkMacSystemFont,'Segoe UI',Roboto,sans-serif;background:#0f172a;color:#f1f5f9;min-height:100vh}
.app{max-width:1400px;margin:0 auto;padding:2rem}
.nav{display:flex;gap:0.5rem;margin-bottom:2rem;flex-wrap:wrap}
.nav a{padding:0.6rem 1.2rem;background:#1e293b;color:#94a3b8;text-decoration:none;border-radius:6px;font-size:0.9rem;transition:all 0.2s}
.nav a:hover,.nav a.active{background:#38bdf8;color:#0f172a;font-weight:600}
.card{background:#1e293b;border-radius:10px;padding:1.5rem;margin-bottom:1.5rem}
.card h2{font-size:1rem;color:#94a3b8;margin-bottom:1rem;text-transform:uppercase;letter-spacing:0.05em}
.stats-grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(150px,1fr));gap:1rem;margin-bottom:1.5rem}
.stat-card{background:#1e293b;border-radius:10px;padding:1.2rem;text-align:center}
.stat-value{font-size:2rem;font-weight:700;color:#38bdf8}
.stat-label{font-size:0.8rem;color:#64748b;text-transform:uppercase;margin-top:0.3rem}
.filter-row{display:flex;gap:0.75rem;flex-wrap:wrap;margin-bottom:1rem;align-items:center}
input,select,textarea{padding:0.5rem 0.8rem;background:#0f172a;border:1px solid #334155;color:#f1f5f9;border-radius:6px;font-size:0.8rem;min-width:140px}
input:focus,select:focus,textarea:focus{outline:none;border-color:#38bdf8}
.btn{padding:0.5rem 1.2rem;background:#38bdf8;color:#0f172a;border:none;border-radius:6px;font-size:0.85rem;font-weight:600;cursor:pointer}
.btn-sm{padding:0.25rem 0.5rem;font-size:0.75rem;border-radius:4px;cursor:pointer;border:none;font-weight:600}
.btn-red{background:#ef4444;color:#fff}
.btn-green{background:#22c55e;color:#fff}
.btn-orange{background:#f59e0b;color:#fff;color:#fff}
.btn-blue{background:#38bdf8;color:#0f172a}
.table-wrap{overflow-x:auto}
table{width:100%;border-collapse:collapse;font-size:0.8rem}
th{text-align:left;padding:0.5rem 0.6rem;background:#0f172a;color:#64748b;font-weight:600;font-size:0.7rem;text-transform:uppercase;white-space:nowrap}
td{padding:0.5rem 0.6rem;border-bottom:1px solid #1e293b}
tr:hover td{background:#1e293b}
.badge{display:inline-block;padding:0.15rem 0.4rem;border-radius:4px;font-size:0.7rem;font-weight:600}
.badge-local{background:#22c55e33;color:#22c55e}
.badge-hq{background:#f59e0b33;color:#f59e0b}
.badge-blue{background:#38bdf833;color:#38bdf8}
.company-group-header{background:#0f172a;color:#38bdf8;font-weight:700;font-size:0.85rem}
.company-group-header td{padding:0.5rem 0.6rem;border-bottom:2px solid #334155}

/* Modal */
.modal-overlay{position:fixed;inset:0;background:rgba(0,0,0,0.7);display:none;align-items:center;justify-content:center;z-index:1000}
.modal-overlay.active{display:flex}
.modal{background:#1e293b;border-radius:10px;padding:2rem;width:90%;max-width:500px;max-height:90vh;overflow-y:auto}
.modal h3{margin-bottom:1rem;color:#f1f5f9}
.modal-row{margin-bottom:1rem}
.modal-row label{display:block;font-size:0.8rem;color:#94a3b8;margin-bottom:0.3rem}
.modal-row input,.modal-row textarea,.modal-row select{width:100%}
.modal-row textarea{min-height:80px;resize:vertical}
.modal-actions{display:flex;gap:0.75rem;justify-content:flex-end;margin-top:1.5rem}

/* Toast */
.toast{position:fixed;bottom:2rem;right:2rem;padding:1rem 1.5rem;border-radius:8px;font-size:0.9rem;font-weight:600;z-index:2000;transform:translateY(150%);transition:transform 0.3s}
.toast.show{transform:translateY(0)}
.toast-success{background:#22c55e;color:#fff}
.toast-error{background:#ef4444;color:#fff}
.truncate{max-width:200px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;display:block}
.page-controls{display:flex;align-items:center;gap:0.5rem;margin-bottom:0.5rem;flex-wrap:wrap}
.page-controls select{padding:0.3rem 0.5rem;font-size:0.8rem;min-width:auto}
.page-info{color:#94a3b8;font-size:0.8rem}
</style>
</head>
<body>
<div class="app">
<div class="nav">
<a href="/finder/">Search</a>
<a href="/finder/sessions">Sessions</a>
<a href="/finder/companies">Companies</a>
<a href="/finder/contacts" class="active">Contacts</a>
<a href="/finder/emails">&#9993; Email Validation</a>
<a href="/finder/audit">Audit</a>
<span style="margin-left:auto;display:flex;gap:0.5rem;align-items:center;font-size:0.8rem;">
  <span style="color:#22c55e;">P1-P5 ✓</span>
  <span style="background:#22c55e33;color:#22c55e;padding:0.3rem 0.6rem;border-radius:4px;font-weight:600;">QC-10 AI ✓</span>
</span>
</div>

<div class="stats-grid">
<div class="stat-card"><div class="stat-value" id="statCompanies">-</div><div class="stat-label">Companies</div></div>
<div class="stat-card"><div class="stat-value" id="statContacts">-</div><div class="stat-label">Contacts</div></div>
<div class="stat-card"><div class="stat-value" id="statSessions">-</div><div class="stat-label">Sessions</div></div>
</div>

<div class="card">
<h2>Contacts</h2>
<div class="filter-row">
<label style="font-size:0.8rem;color:#94a3b8;">Group: <select id="groupBy" onchange="loadContacts()"><option value="company">Company</option><option value="none">Flat List</option></select></label>
<label style="font-size:0.8rem;color:#94a3b8;">Sort: <select id="sortBy" onchange="loadContacts()"><option value="confidence">By Confidence</option><option value="recent">Most Recent</option></select></label>
<label style="font-size:0.8rem;color:#94a3b8;">Company: <select id="filterCompany" onchange="loadContacts()"><option value="">All</option></select></label>
<label style="font-size:0.8rem;color:#94a3b8;">Title: <select id="filterTitle" onchange="loadContacts()"><option value="">All</option></select></label>
<label style="font-size:0.8rem;color:#94a3b8;">City: <select id="filterCity" onchange="loadContacts()"><option value="">All</option></select></label>
<input id="filterCompanyText" placeholder="Or type company..." style="min-width:120px;" />
<input id="filterTitleText" placeholder="Or type title..." style="min-width:100px;" />
<button class="btn" onclick="loadContacts()">Filter</button>
<button class="btn btn-green" onclick="openAddContact()">+ Add Contact</button>
</div>
<div class="page-controls">
<label style="font-size:0.8rem;color:#94a3b8;">Per page: <select id="perPage" onchange="loadContacts()">
<option value="20">20</option><option value="50">50</option><option value="100">100</option><option value="200">200</option>
</select></label>
<span class="page-info" id="pageInfo"></span>
</div>
<div class="table-wrap">
<table>
<thead><tr><th>Name</th><th>Title</th><th>Company</th><th>Email</th><th>Pattern</th><th>Found</th><th>Conf</th><th>Local</th><th>Score</th><th>LinkedIn</th><th>Actions</th></tr></thead>
<tbody id="contactsTable"></tbody>
</table>
</div>
</div>
</div>

<!-- Add Contact Modal -->
<div class="modal-overlay" id="addModal">
<div class="modal">
<h3>Add Contact</h3>
<div class="modal-row"><label>Company</label><select id="addCompany"></select></div>
<div class="modal-row"><label>Full Name *</label><input id="addName" type="text" /></div>
<div class="modal-row"><label>Title *</label><input id="addTitle" type="text" /></div>
<div class="modal-row"><label>LinkedIn URL</label><input id="addLinkedIn" type="url" /></div>
<div class="modal-row"><label>Notes</label><textarea id="addNotes"></textarea></div>
<div class="modal-actions">
<button class="btn btn-orange btn-sm" onclick="closeAddModal()">Cancel</button>
<button class="btn btn-sm" onclick="saveAddContact()">Add Contact</button>
</div>
</div>
</div>

<!-- Edit Modal -->
<div class="modal-overlay" id="editModal">
<div class="modal">
<h3>Edit Contact</h3>
<div class="modal-row"><label>Full Name</label><input id="editName" type="text" /></div>
<div class="modal-row"><label>Title</label><input id="editTitle" type="text" /></div>
<div class="modal-row"><label>LinkedIn URL</label><input id="editLinkedIn" type="url" /></div>
<div class="modal-row"><label>Company</label><select id="editCompany"><option value="">— Select Company —</option></select></div>
<div class="modal-row"><label>Notes</label><textarea id="editNotes"></textarea></div>
<div class="modal-actions">
<button class="btn btn-orange btn-sm" onclick="closeEditModal()">Cancel</button>
<button class="btn btn-sm" onclick="saveEdit()">Save</button>
</div>
</div>
</div>

<!-- Toast -->
<div class="toast" id="toast"></div>

<script>
const API_BASE = '/api';
const API_KEY = 'lf_key_P9xZq3RvLm7YwT2hJm8FvNu4BcDEs6';
let currentEditId = null;
let allContacts = [];
let companyOptions = [];

async function loadStats() {
  try {
    const r = await fetch(API_BASE+'/stats', {headers: {'X-LF-Key': API_KEY}});
    if (!r.ok) return;
    const d = await r.json();
    document.getElementById('statCompanies').textContent = d.companies || 0;
    document.getElementById('statContacts').textContent = d.contacts || 0;
    document.getElementById('statSessions').textContent = d.sessions || 0;
  } catch(e) { console.error('stats error:', e); }
}

async function loadDropdowns() {
  try {
    const r = await fetch(API_BASE+'/contacts/dropdowns', {headers: {'X-LF-Key': API_KEY}});
    if (!r.ok) return;
    const d = await r.json();

    const companySel = document.getElementById('filterCompany');
    companySel.innerHTML = '<option value="">All Companies</option>' +
      (d.companies||[]).map(c => '<option value="'+escapeHtml(c)+'">'+escapeHtml(c)+'</option>').join('');

    const titleSel = document.getElementById('filterTitle');
    titleSel.innerHTML = '<option value="">All Titles</option>' +
      (d.titles||[]).map(t => '<option value="'+escapeHtml(t)+'">'+escapeHtml(t)+'</option>').join('');

    const citySel = document.getElementById('filterCity');
    citySel.innerHTML = '<option value="">All Cities</option>' +
      (d.cities||[]).map(c => '<option value="'+escapeHtml(c)+'">'+escapeHtml(c)+'</option>').join('');
  } catch(e) { console.error('dropdowns error:', e); }
}

function escapeHtml(s) {
  if (s == null) return '';
  return String(s).replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;').replace(/'/g,'&#39;');
}

async function loadContacts() {
  const company = document.getElementById('filterCompany').value;
  const title = document.getElementById('filterTitle').value;
  const city = document.getElementById('filterCity').value;
  const compText = document.getElementById('filterCompanyText').value.trim();
  const titleText = document.getElementById('filterTitleText').value.trim();
  const perPage = parseInt(document.getElementById('perPage').value) || 20;
  const groupBy = document.getElementById('groupBy').value;
  // Issue #6: 'Most Recent' sort option
  const sortBy = document.getElementById('sortBy').value;

  let url = API_BASE+'/contacts?limit=500';
  if (compText && !company) url += '&company_name='+encodeURIComponent(compText);
  else if (company) url += '&company_name='+encodeURIComponent(company);
  if (titleText && !title) url += '&title='+encodeURIComponent(titleText);
  else if (title) url += '&title='+encodeURIComponent(title);
  if (city) url += '&city='+encodeURIComponent(city);
  if (sortBy) url += '&sort='+encodeURIComponent(sortBy);

  try {
    const r = await fetch(url, {headers: {'X-LF-Key': API_KEY}});
    const data = await r.json();
    allContacts = data.contacts || [];
    renderContacts(allContacts, perPage, groupBy);
  } catch(e) {
    showToast('Failed to load contacts', 'error');
  }
}

function renderContacts(contacts, perPage, groupBy) {
  const tbody = document.getElementById('contactsTable');
  tbody.innerHTML = '';
  const pageInfo = document.getElementById('pageInfo');

  if (contacts.length === 0) {
    pageInfo.textContent = 'No contacts found';
    return;
  }

  // Group by company if selected
  let grouped = {};
  if (groupBy === 'company') {
    for (const ct of contacts) {
      const key = ct.company_name || 'Unknown Company';
      if (!grouped[key]) grouped[key] = [];
      grouped[key].push(ct);
    }
  } else {
    grouped = {'': contacts};
  }

  const companyKeys = Object.keys(grouped).sort();
  const totalContacts = contacts.length;
  pageInfo.textContent = totalContacts + ' contacts' + (totalContacts > perPage ? ' (showing ' + perPage + ')' : '');

  let count = 0;
  const maxShow = Math.min(perPage, totalContacts);

  for (const companyName of companyKeys) {
    const groupContacts = grouped[companyName];
    const companyId = groupContacts[0]?.company_id || '';
    for (const ct of groupContacts) {
      if (count >= maxShow) break;
      count++;
      if (count === 1 || (groupBy === 'company' && ct === groupContacts[0])) {
        // Company group header with Add Contact button (Issue #6: colspan=10 for new "Found" column)
        const headerRow = document.createElement('tr');
        headerRow.className = 'company-group-header';
        headerRow.dataset.companyId = companyId;
        headerRow.innerHTML = '<td colspan="10">&#9654; ' + escapeHtml(companyName) + ' (' + groupContacts.length + ')</td>' +
          '<td><button class="btn-sm btn-green" onclick="openAddContactForCompany(' + companyId + ',\'' + escapeHtml(companyName).replace(/'/g,"\\'") + '\')" title="Add contact to ' + escapeHtml(companyName) + '">+ Add</button></td>';
        tbody.appendChild(headerRow);
      }

      const tr = document.createElement('tr');
      tr.dataset.contactId = ct.id;
      const conf = (ct.confidence_score||0).toFixed(1);
      const badge = ct.is_local ? '<span class="badge badge-local">LOCAL</span>' : '<span class="badge badge-hq">HQ</span>';
      const li = ct.linkedin_url ? '<a href="'+escapeHtml(ct.linkedin_url)+'" target="_blank" style="color:#38bdf8;text-decoration:none;" title="'+escapeHtml(ct.linkedin_url)+'">&#x1F517;</a>' : '<span style="color:#64748b;">—</span>';
      const email = ct.email ? '<span style="color:#22c55e;font-size:0.75rem;word-break:break-all;">'+escapeHtml(ct.email)+'</span>' : (ct.company_email_pattern ? '<span style="color:#64748b;font-size:0.75rem;">(derivable)</span>' : '<span style="color:#64748b;">—</span>');
      const pattern = ct.company_email_pattern || '';
      const patConf = ct.company_email_confidence || 0;
      const patBadge = pattern ? (patConf >= 1.0 ? '<span style="color:#22c55e;font-size:0.7rem;">&#10003; '+escapeHtml(pattern)+'</span>' : '<span style="color:#f59e0b;font-size:0.7rem;">~ '+escapeHtml(pattern)+'</span>') : '<span style="color:#64748b;font-size:0.7rem;">—</span>';
      const patConfStr = pattern ? (patConf*100).toFixed(0)+'%' : '';
      // Issue #6: format found_at for display
      let foundDisplay = '<span style="color:#64748b;">—</span>';
      if (ct.found_at) {
        // found_at is an ISO timestamp; show as YYYY-MM-DD
        const d = (ct.found_at || '').substring(0, 10);
        foundDisplay = '<span style="color:#94a3b8;font-size:0.75rem;" title="'+escapeHtml(ct.found_at)+'">'+escapeHtml(d)+'</span>';
      }

      const deriveBtn = (!ct.email && ct.company_email_pattern) ? '<button class="btn-sm btn-blue" onclick="deriveEmail('+ct.id+')" title="Derive email from pattern">&#9993;</button>' : '';
      const verifyBtn = '<button class="btn-sm btn-blue" onclick="verifyTitle('+ct.id+')" title="AI-verify this contact\'s title" style="background:#8b5cf6;color:#fff;">&#9889;</button>';

      const actions = '<button class="btn-sm btn-green" onclick="openEdit('+ct.id+','+JSON.stringify(ct).replace(/"/g,'&quot;')+')">&#9998;</button> <button class="btn-sm btn-red" onclick="deleteContact('+ct.id+',\''+escapeHtml(ct.full_name).replace(/'/g,"\\'")+'\')">&#128465;</button> <button class="btn-sm btn-orange" onclick="exportContact('+JSON.stringify(ct).replace(/"/g,'&quot;')+')">&#128230;</button>'+deriveBtn+verifyBtn;

      tr.innerHTML = '<td style="font-weight:600;">'+escapeHtml(ct.full_name)+'</td>'+
        '<td><span class="truncate" title="'+escapeHtml(ct.title||'')+'">'+escapeHtml(ct.title||'-')+'</span></td>'+
        '<td><span class="truncate" title="'+escapeHtml(ct.company_name||'')+'">'+escapeHtml(ct.company_name||'')+'</span></td>'+
        '<td>'+email+'</td><td>'+patBadge+'</td><td>'+foundDisplay+'</td><td style="color:#94a3b8;font-size:0.75rem;">'+patConfStr+'</td><td>'+badge+'</td><td>'+conf+'</td><td>'+li+'</td><td>'+actions+'</td>';
      tbody.appendChild(tr);
    }
    if (count >= maxShow) break;
  }
}

async function deriveEmail(contactId) {
  try {
    const r = await fetch(API_BASE+'/contact/'+contactId+'/derive-email', {
      method: 'POST',
      headers: {'X-LF-Key': API_KEY}
    });
    const d = await r.json();
    if (d.status === 'ok') {
      showToast('Email derived: '+d.email, 'success');
      loadContacts();
    } else {
      showToast(d.reason || 'Failed to derive email', 'error');
    }
  } catch(e) {
    showToast('Derive error: '+e.message, 'error');
  }
}

async function verifyTitle(contactId) {
  showToast('AI verifying title...', 'info');
  try {
    const r = await fetch(API_BASE+'/contact/'+contactId+'/verify-title', {
      method: 'POST',
      headers: {'X-LF-Key': API_KEY}
    });
    const d = await r.json();
    if (d.status === 'ok') {
      showToast('Title verified: "'+d.previous_title+'" → "'+d.title+'" (confidence: '+(d.confidence*100).toFixed(0)+'%)', 'success');
      loadContacts();
    } else {
      showToast(d.reason || 'Title verification failed', 'error');
    }
  } catch(e) {
    showToast('Verify error: '+e.message, 'error');
  }
}

function exportContact(contact) {
  const rows = [['Full Name','Title','Company','Email','LinkedIn URL','Notes','Company Email Pattern','Company Email Confidence','Is Local','Confidence Score','Data Provenance']];
  const vals = [
    contact.full_name||'', contact.title||'', contact.company_name||'', contact.email||'',
    contact.linkedin_url||'', contact.manual_notes||'', contact.company_email_pattern||'',
    (contact.company_email_confidence||0).toFixed(2), contact.is_local ? 'YES' : 'NO',
    (contact.confidence_score||0).toFixed(2), contact.data_provenance||''
  ];
  rows.push(vals);
  const csvContent = rows.map(e => e.map(v => '"' + String(v).replace(/"/g,'""') + '"').join(',')).join('\n');
  const blob = new Blob([csvContent], {type:'text/csv;charset=utf-8;'});
  const link = document.createElement('a');
  link.href = URL.createObjectURL(blob);
  link.download = 'contact_'+contact.id+'.csv';
  document.body.appendChild(link);
  link.click();
  document.body.removeChild(link);
}

async function loadCompanyOptions() {
  if (companyOptions.length > 0) return;
  const r = await fetch(API_BASE+'/companies?limit=500', {headers: {'X-LF-Key': API_KEY}});
  const d = await r.json();
  companyOptions = d.companies || [];
}

async function openEdit(id, contact) {
  currentEditId = id;
  await loadCompanyOptions();
  const sel = document.getElementById('editCompany');
  sel.innerHTML = '<option value="">— Select Company —</option>';
  for (const c of companyOptions) {
    const sel2 = c.id === contact.company_id ? 'selected' : '';
    sel.innerHTML += '<option value="'+c.id+'" '+sel2+'>'+escapeHtml(c.name)+' ('+escapeHtml(c.city||'')+', '+escapeHtml(c.state||'')+')</option>';
  }
  document.getElementById('editName').value = contact.full_name || '';
  document.getElementById('editTitle').value = contact.title || '';
  document.getElementById('editLinkedIn').value = contact.linkedin_url || '';
  document.getElementById('editNotes').value = contact.manual_notes || '';
  document.getElementById('editModal').classList.add('active');
}

function closeEditModal() {
  document.getElementById('editModal').classList.remove('active');
  currentEditId = null;
}

async function saveEdit() {
  if (!currentEditId) return;
  const companyId = document.getElementById('editCompany').value;
  const body = {
    full_name: document.getElementById('editName').value.trim(),
    title: document.getElementById('editTitle').value.trim(),
    linkedin_url: document.getElementById('editLinkedIn').value.trim(),
    manual_notes: document.getElementById('editNotes').value.trim(),
  };
  if (companyId) body.company_id = parseInt(companyId);
  const r = await fetch(API_BASE+'/contact/'+currentEditId, {
    method: 'PATCH',
    headers: {'Content-Type':'application/json','X-LF-Key':API_KEY},
    body: JSON.stringify(body)
  });
  if (r.ok) {
    showToast('Contact updated', 'success');
    closeEditModal();
    loadContacts();
  } else {
    showToast('Failed to update contact', 'error');
  }
}

async function deleteContact(id, name) {
  if (!confirm('Soft-delete "'+name+'"?\n\nIt will be hidden but recoverable.')) return;
  const r = await fetch(API_BASE+'/contact/'+id, {method: 'DELETE', headers: {'X-LF-Key': API_KEY}});
  if (r.ok) {
    showToast('Contact deleted', 'success');
    const row = document.querySelector('tr[data-contact-id="'+id+'"]');
    if (row) { row.style.transition='opacity 0.3s'; row.style.opacity='0'; setTimeout(()=>row.remove(), 350); }
  } else {
    showToast('Failed to delete', 'error');
  }
}

function showToast(msg, type) {
  const t = document.getElementById('toast');
  t.textContent = msg;
  t.className = 'toast toast-'+type+' show';
  setTimeout(()=>t.classList.remove('show'), 3000);
}

// ── Add Contact Modal ─────────────────────────────────────────────────────────
let addCompanyId = null;

async function openAddContactForCompany(companyId, companyName) {
  addCompanyId = companyId;
  const sel = document.getElementById('addCompany');
  // Populate if empty
  if (sel.options.length <= 1) {
    const r = await fetch(API_BASE+'/companies?limit=500', {headers: {'X-LF-Key': API_KEY}});
    const d = await r.json();
    sel.innerHTML = '<option value="">— Select Company —</option>';
    for (const c of (d.companies||[])) {
      sel.innerHTML += '<option value="'+c.id+'">'+escapeHtml(c.name)+' ('+escapeHtml(c.city||'')+', '+escapeHtml(c.state||'')+')</option>';
    }
  }
  sel.value = companyId;
  document.getElementById('addName').value = '';
  document.getElementById('addTitle').value = '';
  document.getElementById('addLinkedIn').value = '';
  document.getElementById('addNotes').value = '';
  document.getElementById('addModal').classList.add('active');
}

function closeAddModal() {
  document.getElementById('addModal').classList.remove('active');
  addCompanyId = null;
}

async function saveAddContact() {
  const companyId = addCompanyId || document.getElementById('addCompany').value;
  const name = document.getElementById('addName').value.trim();
  const title = document.getElementById('addTitle').value.trim();
  const linkedin = document.getElementById('addLinkedIn').value.trim();
  const notes = document.getElementById('addNotes').value.trim();

  if (!companyId) { showToast('Please select a company', 'error'); return; }
  if (!name) { showToast('Name is required', 'error'); return; }
  if (!title) { showToast('Title is required', 'error'); return; }

  try {
    const r = await fetch(API_BASE+'/company/'+companyId+'/contact', {
      method: 'POST',
      headers: {'Content-Type':'application/json','X-LF-Key':API_KEY},
      body: JSON.stringify({full_name: name, title, linkedin_url: linkedin, notes})
    });
    const d = await r.json();
    if (d.status === 'ok') {
      showToast('Contact "'+name+'" added', 'success');
      closeAddModal();
      loadContacts();
    } else {
      showToast(d.detail || 'Failed to add contact', 'error');
    }
  } catch(e) {
    showToast('Error: '+e.message, 'error');
  }
}

document.getElementById('addModal').addEventListener('click', function(e) {
  if (e.target === this) closeAddModal();
});

document.getElementById('editModal').addEventListener('click', function(e) {
  if (e.target === this) closeEditModal();
});

loadStats();
loadDropdowns();
loadContacts();
</script>
</body>
</html>
